# Full local/self-hosted stack: PostgreSQL + the backend API, both containerized. Suitable for a
# laptop (`docker compose up -d`) or a self-hosted NAS (e.g. Synology Container Manager pointed at
# this file) - see the root README's "Running on a NAS" section.
#
# Postgres deliberately has NO database or schema pre-created - that is the point: it lets the
# application's own startup sequence (DatabaseBootstrapInitializer creates the `trackmywealth`
# database, then Flyway creates the schema) do its job, rather than relying on Postgres's
# image-level POSTGRES_DB variable to do that step for you. See
# docs/architecture/adr/0001-database-auto-migration.md.
#
# The native apps ship through the app stores. The web app is the optional `web` service below
# (`docker compose --profile web up -d`), which serves the Expo export with the security headers of
# #536; it must sit behind an HTTPS reverse proxy. See mobile/README.md, "Web app".
services:
  postgres:
    image: postgres:16
    environment:
      # The PostgreSQL superuser. Only provisioning uses it; with the role split below, the backend
      # never receives its password. Set POSTGRES_PASSWORD in .env for a real installation (it only
      # takes effect when the data volume is created).
      POSTGRES_USER: trackmywealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackmywealth}
      # POSTGRES_DB is not set, so the image creates an empty database named after POSTGRES_USER
      # (trackmywealth) on a fresh volume; Flyway then creates the schema in it on the backend's
      # first start. With the role split, the init script hands that database to the migration
      # role first. (The backend's own CREATE DATABASE, DB_AUTO_CREATE, covers a bare PostgreSQL
      # server outside this compose stack.)
      #
      # US-28-05 (#331): the database role split - see the root README, "Database roles". With
      # DB_MIGRATION_PASSWORD set in .env, a fresh volume gets the roles trackmywealth_migration
      # (owns the schema, runs Flyway) and trackmywealth_runtime (the backend, bound by row-level
      # security). An existing volume keeps its single role until you run the documented upgrade.
      TMW_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      TMW_RUNTIME_PASSWORD: ${DB_PASSWORD:-}
    ports:
      # Published on this host's loopback only: PostgreSQL holds every workspace's data, and the
      # backend reaches it over the compose network anyway. Set POSTGRES_PUBLISH_ADDRESS=0.0.0.0 in
      # .env only if another machine must connect directly (e.g. a database tool on your LAN).
      - "${POSTGRES_PUBLISH_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - trackmywealth_pgdata:/var/lib/postgresql/data
      # The role split's scripts; the image runs initdb/ once, on an empty data volume only.
      - ./deploy/postgres:/trackmywealth:ro
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, not the socket: while the image runs initdb/ on a fresh volume, its temporary
      # server answers on the socket only, and the backend must not start against it.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trackmywealth"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `postgres` here is the other service's name, resolved via Docker's internal DNS - not
      # `localhost`, since the two containers are not the same network namespace.
      DB_URL: jdbc:postgresql://postgres:5432/trackmywealth
      # US-28-05 (#331): unset, the backend connects as the superuser above and runs the migrations
      # itself (single-role setup, a startup warning says so). With the role split, .env sets
      # DB_USERNAME=trackmywealth_runtime and DB_MIGRATION_USERNAME=trackmywealth_migration - see
      # .env.example and the root README, "Database roles".
      DB_USERNAME: ${DB_USERNAME:-trackmywealth}
      # Single-role: the superuser's own password, POSTGRES_PASSWORD, when .env changed it.
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-trackmywealth}}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      # true: refuse to start while connected as a role that bypasses row-level security.
      DB_REQUIRE_RLS_BOUND_ROLE: ${DB_REQUIRE_RLS_BOUND_ROLE:-false}
      # FR-AUT-003/005 / #188: a real self-hosted deployment must never sign access tokens
      # with the repository's public placeholder. A .env file next to this compose file is loaded
      # automatically. When JWT_SECRET is absent we pass an empty value so postgres-only developer
      # commands can still parse this compose file; JwtProperties rejects the backend startup.
      # Generate one with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:-}
      # #544: forward both deployment keys. Empty is intentionally accepted for a postgres-only
      # compose invocation: account identification remains disabled and self-hosted MFA emits
      # the public-placeholder warning. Set independent random keys before real use.
      # For MFA, the backend migrates existing placeholder-encrypted secrets once, atomically.
      IMPORT_ACCOUNT_IDENTIFIER_KEY: ${IMPORT_ACCOUNT_IDENTIFIER_KEY:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # If you put a reverse proxy in front of this stack, see the root README's "Running behind
      # a reverse proxy" section before setting this:
      #   TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      # The zone whose calendar date is "today" for balances and net worth (default Europe/Zurich,
      # which has the same offsets as Germany's zone). The container itself runs in UTC, so leave
      # this alone unless you are outside Switzerland/Germany - see the root README:
      #   BUSINESS_ZONE: ${BUSINESS_ZONE}
    ports:
      - "8080:8080"
    restart: unless-stopped

  # #536: the web app, built from mobile/ and served by nginx with Cache-Control no-store, CSP,
  # HSTS, no-referrer and no framing. Opt-in: `docker compose --profile web up -d --build`.
  web:
    profiles: [web]
    build:
      context: ./mobile
      dockerfile: deploy/nginx/Dockerfile
      args:
        # The server address the sign-in form suggests (baked into the export at build time).
        EXPO_PUBLIC_API_URL: ${WEB_API_URL:-http://localhost:8080}
    environment:
      # Every API origin members may sign in to, space-separated, without a path. The CSP
      # (connect-src) blocks all others. HTTPS only, except loopback for local testing.
      WEB_API_ORIGINS: ${WEB_API_ORIGINS:-http://localhost:8080}
    ports:
      # Loopback only: the HTTPS reverse proxy on this host forwards to it.
      - "${WEB_PUBLISH_ADDRESS:-127.0.0.1}:${WEB_PORT:-8082}:8082"
    restart: unless-stopped

volumes:
  trackmywealth_pgdata:
