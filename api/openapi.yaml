    ImportStatementBalanceRule:
      type: object
      properties:
        pattern:
          type: string
          description: "RE2 pattern with the named groups date and amount, and optionally\
            \ currency and sign, e.g. Kontostand vom (?P<date>\\S+): (?P<amount>\\\
            S+). A statement with sections in several currencies needs the currency\
            \ group: without it, every balance is taken to be in the account's currency.\
            \ The date group may be left out when statementDatePattern gives the date."
          maxLength: 1000
          minLength: 0
        dateFormat:
          type: string
          description: "Optional: the date's format, if not the template's date format."
          maxLength: 30
          minLength: 0
        statementDatePattern:
          type: string
          description: "Optional RE2 pattern with the one named group date, e.g. Abrechnung\
            \ vom \\S+ bis (?P<date>\\S+): its first match in the file with a readable\
            \ date dates every balance line that has no date of its own."
          maxLength: 1000
          minLength: 0
        statementDateFormat:
          type: string
          description: "Optional: the format of statementDatePattern's date, if not\
            \ the balance lines'."
          maxLength: 30
          minLength: 0
