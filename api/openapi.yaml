  /api/v1/institutions/catalogue:
    get:
      tags:
      - Institutions
      summary: Search the institution catalogue
      operationId: searchInstitutionCatalogue
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page number.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Items per page; a larger value is capped to 200, and page.size\
          \ in the response says the size applied."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: sort
        in: query
        description: "Repeatable <field>[,asc|desc]; any other field is a 400 INVALID_SORT.\
          \ Default: name,asc. The order always ends with a unique tie-breaker, so\
          \ pages never overlap."
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - name
            - "name,asc"
            - "name,desc"
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 8
          pattern: "[A-Za-z0-9._-]{8,64}"
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseInstitutionCatalogueEntrySummaryResponse"
        "400":
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          $ref: "#/components/responses/ApiProblemResponse"
        default:
          headers:
