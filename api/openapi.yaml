        required: false
        schema:
          type: string
          enum:
          - CARD_SETTLEMENT
          - TRANSFER
      - name: cardAccountId
        in: query
        description: Only matches belonging to this card or credited account.
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page number.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Items per page; a larger value is capped to 200, and page.size\
          \ in the response says the size applied."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: sort
        in: query
        description: "Repeatable <field>[,asc|desc]; any other field is a 400 INVALID_SORT.\
          \ Default: createdAt,desc. The order always ends with a unique tie-breaker,\
          \ so pages never overlap."
        required: false
