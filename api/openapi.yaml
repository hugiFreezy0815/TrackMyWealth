                type: integer
                format: int64
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        default:
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          $ref: "#/components/responses/ApiProblemResponse"
