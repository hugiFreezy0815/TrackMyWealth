  /api/v1/accounts/{accountId}/amortisation-schedule:
    get:
      tags:
      - Loans
      summary: List a loan's amortisation schedule
      operationId: listAmortisationEntries
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page number.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Items per page; a larger value is capped to 200, and page.size\
          \ in the response says the size applied."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: sort
        in: query
        description: "Repeatable <field>[,asc|desc]; any other field is a 400 INVALID_SORT.\
          \ Default: dueDate,asc. The order always ends with a unique tie-breaker,\
          \ so pages never overlap."
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - dueDate
            - "dueDate,asc"
            - "dueDate,desc"
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 8
          pattern: "[A-Za-z0-9._-]{8,64}"
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseAmortisationScheduleEntryResponse"
        "400":
          description: |-
            Problem codes:
            - `VALIDATION_FAILED`: The request body or parameters are malformed or fail validation; errors lists each rejected field. Also any other 4xx without a code of its own (e.g. 405, 415).
            - `INVALID_SORT`: A paged list was asked to sort by a field it does not offer, or in a malformed way; detail names the field and the fields the list sorts by.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: |-
            Problem codes:
            - `UNAUTHENTICATED`: No valid access token, or a sign-in was refused.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: |-
            Problem codes:
            - `NOT_FOUND`: Not found, or not visible to the caller; the two are never told apart.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "422":
          description: |-
            Problem codes:
            - `UNPROCESSABLE`: Well-formed, but breaks a business rule; detail names the rule.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: |-
            Problem codes:
            - `INTERNAL`: Unexpected; quote the correlationId when reporting it. Also any other 5xx without a code of its own.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
