          $ref: "#/components/responses/ApiProblemResponse"
      x-problem-codes:
      - VALIDATION_FAILED
      - INVALID_SORT
      - UNAUTHENTICATED
      - NOT_FOUND
      - UNPROCESSABLE
      - INTERNAL
