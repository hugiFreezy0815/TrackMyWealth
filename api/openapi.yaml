          maxLength: 1000
          minLength: 0
        documentMarker:
          type: string
          description: Literal text every statement of this layout contains.
          maxLength: 200
          minLength: 0
        recordStartPattern:
          type: string
          description: RE2 pattern; a line on which it finds a match is a booking
            line.
          maxLength: 1000
          minLength: 0
        headerLabels:
          type: array
          description: "Optional (text layer only): the labels of the booking table's\
            \ header line, in order. Each word of a booking line becomes the cell\
            \ of the label above it."
          items:
            type: string
          maxItems: 50
          minItems: 0
        continuationColumn:
          type: string
          description: "Optional: the column that lines following a booking line,\
            \ and no booking themselves, are appended to."
          maxLength: 100
          minLength: 0
        sectionPattern:
          type: string
          description: "Optional RE2 pattern; a line on which it finds a match starts\
            \ a section, whose first capture group is the sectionColumn cell of its\
            \ bookings."
          maxLength: 1000
          minLength: 0
        sectionColumn:
          type: string
          description: "Optional: the column holding the section pattern's first group."
          maxLength: 100
          minLength: 0
        balanceLinePattern:
          type: string
          description: "Optional RE2 pattern; a line on which it finds a match states\
            \ a balance (its first capture group) and is never a booking. Include\
            \ carry-forward lines at page breaks, or they continue the page's last\
            \ booking."
          maxLength: 1000
          minLength: 0
        balanceColumn:
          type: string
          description: "Optional: the column holding each booking's running balance;\
            \ every booking is then checked against the balance before it."
          maxLength: 100
          minLength: 0
        continuationEndPattern:
          type: string
          description: "Optional RE2 pattern; a line on which it finds a match ends\
            \ the booking above it, and no line continues a booking until the next\
            \ booking line."
          maxLength: 1000
          minLength: 0
        flowColumn:
          type: string
          description: "Optional (with headerLabels): the label of free text that\
            \ may run on under the next labels; a word following it at word spacing\
            \ stays in it."
          maxLength: 100
          minLength: 0
