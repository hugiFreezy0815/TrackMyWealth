  /api/v1/accounts/{accountId}/imports:
    get:
      tags:
      - Imports
      summary: List an account's imports
      operationId: listImportBatches
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page number.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Items per page; a larger value is capped to 200, and page.size\
          \ in the response says the size applied."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: sort
        in: query
        description: "Repeatable <field>[,asc|desc]; any other field is a 400 INVALID_SORT.\
          \ Default: uploadedAt,desc. The order always ends with a unique tie-breaker,\
          \ so pages never overlap."
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - uploadedAt
            - "uploadedAt,asc"
            - "uploadedAt,desc"
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 8
          pattern: "[A-Za-z0-9._-]{8,64}"
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseImportBatchResponse"
        "400":
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          $ref: "#/components/responses/ApiProblemResponse"
        default:
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          $ref: "#/components/responses/ApiProblemResponse"
    post:
      tags:
      - Imports
      summary: Upload a statement file for import
      operationId: createImportBatch
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: templateId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: snapshotDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 8
          pattern: "[A-Za-z0-9._-]{8,64}"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImportBatchResponse"
        "503":
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
