openapi: 3.1.0
info:
  title: TrackMyWealth API
  description: The REST API of TrackMyWealth. Committed as api/openapi.yaml; the build
    fails when it differs from the code.
  version: v1
servers:
- url: /
  description: The server serving this document
paths:
  /api/v1/accounts:
    get:
      tags:
      - Accounts
      summary: List the workspace's accounts with their current value
      description: "Every active account of the workspace, or every archived one with\
        \ archived=true, oldest first. Not paged: a workspace holds tens of accounts.\
        \ Amounts are signed (assets positive, liabilities negative) and come from\
        \ the same valuation as net worth."
      operationId: listAccounts
      parameters:
      - name: portfolioId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: accountType
        in: query
        required: false
        schema:
          type: string
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 8
          pattern: "[A-Za-z0-9._-]{8,64}"
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountListItemResponse"
        default:
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          $ref: "#/components/responses/ApiProblemResponse"
    post:
      tags:
      - Accounts
      summary: Create an account
      operationId: createAccount
      parameters:
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 8
          pattern: "[A-Za-z0-9._-]{8,64}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            '*/*':
