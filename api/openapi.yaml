            \ treat otherwise than the preview stored it (#308), as the ledger has\
            \ changed since: NEW, a duplicate whose booking is gone, imported as a\
            \ new row; REPOINTED, a duplicate whose booking another ledger row holds\
            \ now (a correction, a restored void); DUPLICATE, a new row whose booking\
            \ the ledger has gained. status, included, duplicateOfTransactionId and\
            \ duplicateOf already show what the commit will do. Null for every other\
            \ row."
