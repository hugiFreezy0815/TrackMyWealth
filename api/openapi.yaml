          pattern: "[A-Za-z0-9._-]{8,64}"
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseImportRowResponse"
