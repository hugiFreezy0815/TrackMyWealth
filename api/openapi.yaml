    ApiProblem:
      type: object
      description: RFC 9457 problem detail extended with a stable application code
        and correlation id.
      properties:
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          type: string
          description: "Stable application error code (docs/api/error-codes.md); each\
            \ operation lists the codes it can return. An open set: new codes are\
            \ added without a new API version, so a client must handle a code it does\
            \ not know by the response's HTTP status. Existing codes are never renamed,\
            \ and removed only as a declared breaking change."
          x-extensible-enum:
          - VALIDATION_FAILED
          - INVALID_SORT
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - VERSION_REQUIRED
          - VERSION_CONFLICT
          - RETRY
          - ACCOUNT_ARCHIVED
          - IMMUTABLE_FIELD
          - UNPROCESSABLE
          - POSITIONS_NOT_APPLICABLE
          - OPENING_BALANCE_NOT_APPLICABLE
          - OPENING_BALANCE_AFTER_FIRST_TRANSACTION
          - OPENING_BALANCE_NOT_RECORDED
          - RECONCILIATION_STALE
          - RECONCILIATION_FINALIZED
          - RECONCILIATION_ADJUSTMENT_LOCKED
          - IMPORT_TEMPLATE_INVALID
          - IMPORT_TEMPLATE_UNSUPPORTED
          - IMPORT_TEMPLATE_READ_ONLY
          - IMPORT_TEMPLATE_IN_USE
          - IMPORT_TEMPLATE_MISMATCH
          - IMPORT_ENCODING_SUSPECT
          - IMPORT_FILE_EMPTY
          - IMPORT_FILE_NO_DATA_ROWS
          - IMPORT_FILE_MALFORMED
          - IMPORT_FILE_TOO_LARGE
          - IMPORT_FILE_TOO_MANY_ROWS
          - IMPORT_CAMT_UNSUPPORTED
          - IMPORT_CAMT_LIMIT_EXCEEDED
          - IMPORT_CAMT_MULTIPLE_ACCOUNTS
          - IMPORT_FILE_TOO_MANY_PAGES
          - IMPORT_PDF_LIMIT_EXCEEDED
          - IMPORT_PDF_NO_TEXT
          - IMPORT_PDF_BUSY
          - IMPORT_SPREADSHEET_LIMIT_EXCEEDED
          - IMPORT_SPREADSHEET_BUSY
          - IMPORT_OCR_FAILED
          - IMPORT_OCR_UNAVAILABLE
          - IMPORT_BATCH_STATE
          - IMPORT_TOO_MANY_OPEN_BATCHES
          - IMPORT_ROW_NOT_INCLUDABLE
          - IMPORT_ACCOUNT_UNCONFIRMED
          - IMPORT_SNAPSHOT_ALREADY_RECORDED
          - IMPORT_SNAPSHOT_CONFLICT
          - IMPORT_SNAPSHOT_RECONCILIATION_DECIDED
          - IMPORT_HOLDINGS_UNRESOLVED
          - IMPORT_HOLDINGS_UNREADABLE
          - IMPORT_ROLLBACK_RECONCILIATION_DECIDED
          - ACCOUNT_IDENTIFIER_INVALID
          - ACCOUNT_IDENTIFIER_IN_USE
          - ACCOUNT_IDENTIFIER_NOT_IN_FILE
          - ACCOUNT_IDENTIFICATION_UNAVAILABLE
          - SAVINGS_POCKET_NOT_APPLICABLE
          - SAVINGS_POCKET_UNSUITABLE
          - SAVINGS_POCKET_IN_USE
          - LOCKED
          - RATE_LIMITED
          - INTERNAL
        correlationId:
          type: string
          description: Request correlation id; quote it when reporting an error.
        instance:
          type: string
          format: uri
        errors:
          type: array
          description: Present on bean-validation failures; one entry per rejected
            field.
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
      - code
      - status
      - title
