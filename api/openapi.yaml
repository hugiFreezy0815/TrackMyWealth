            format: uuid
      - name: categoryId
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: bookingDateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: bookingDateTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: uncategorized
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: amountMin
        in: query
        required: false
        schema:
          type: string
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
      - name: amountMax
        in: query
        required: false
        schema:
          type: string
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
      - name: currency
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page number.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Items per page; a larger value is capped to 200, and page.size\
          \ in the response says the size applied."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: sort
        in: query
        description: "Repeatable <field>[,asc|desc]; any other field is a 400 INVALID_SORT.\
          \ Default: bookingDate,desc. The order always ends with a unique tie-breaker,\
          \ so pages never overlap."
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - bookingDate
            - "bookingDate,asc"
            - "bookingDate,desc"
            - amount
            - "amount,asc"
            - "amount,desc"
