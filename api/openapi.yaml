components:
  schemas:
    AccountContribution:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
        nature:
          type: string
        nativeCurrency:
          type: string
        value:
          type:
          - string
          - "null"
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
        conversionRate:
          type:
          - string
          - "null"
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
        conversionRateDate:
          type:
          - string
          - "null"
          format: date
        conversionRateCarriedForward:
          type: boolean
        conversionRateStale:
          type: boolean
        valueKnown:
          type: boolean
        valueSourceDate:
          type:
          - string
          - "null"
          format: date
        valueSourceStale:
          type: boolean
        warnings:
          type: array
          items:
            type: string
      required:
      - accountId
      - conversionRate
      - conversionRateCarriedForward
      - conversionRateDate
      - conversionRateStale
      - name
      - nativeCurrency
      - nature
      - value
      - valueKnown
      - valueSourceDate
      - valueSourceStale
      - warnings
    AccountIdentifierFromImportRequest:
      type: object
      properties:
        importAccountId:
          type: string
          format: uuid
          description: The account the import batch belongs to.
        batchId:
          type: string
          format: uuid
          description: An open import batch (UPLOADED or PARSED) whose file names
            the account.
      required:
      - batchId
      - importAccountId
    AccountIdentifierRequest:
      type: object
      properties:
        identifier:
          type: string
          description: "An IBAN; for a credit card account, its card number masked\
            \ except for at most the first 6 and the last 4 digits."
          maxLength: 64
          minLength: 0
        kind:
          type: string
          description: "IBAN, MASKED_CARD or CONTRACT_NUMBER (a ten-digit contract\
            \ number, kept beside the IBAN); the account's own kind when omitted."
          pattern: IBAN|MASKED_CARD|CONTRACT_NUMBER
      required:
      - identifier
    AccountIdentifierResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        kind:
          type: string
        identifierMasked:
          type:
          - string
          - "null"
        version:
          type: integer
          format: int32
        contractIdentifierMasked:
          type:
          - string
          - "null"
      required:
      - accountId
      - contractIdentifierMasked
      - identifierMasked
      - kind
      - version
    AccountListItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
        name:
          type: string
        accountType:
          type: string
        nature:
          type: string
        portfolioId:
          type: string
          format: uuid
        portfolioName:
          type: string
        currency:
          type: string
        archived:
          type: boolean
        hasTransactions:
          type: boolean
        hasStatementCycle:
          type: boolean
        hasAmortisation:
          type: boolean
        savingsPocketAccountId:
          type:
          - string
          - "null"
          format: uuid
        balance:
          type:
          - string
          - "null"
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
        workspaceCurrency:
          type: string
        balanceInWorkspaceCurrency:
          type:
          - string
          - "null"
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
        valueKnown:
          type: boolean
        valueStatus:
          type: string
          enum:
          - CURRENT
          - ESTIMATED
          - STALE
          - UNRECONCILED
          - UNKNOWN
        valueBasis:
          type:
          - string
          - "null"
        asOf:
          type: string
          format: date
        valueSourceDate:
          type:
          - string
          - "null"
          format: date
        warnings:
          type: array
          items:
            type: string
      required:
      - accountType
      - archived
      - asOf
      - balance
      - balanceInWorkspaceCurrency
      - currency
      - hasAmortisation
      - hasStatementCycle
      - hasTransactions
      - id
      - name
      - nature
      - portfolioId
      - portfolioName
      - savingsPocketAccountId
      - valueBasis
      - valueKnown
      - valueSourceDate
      - valueStatus
      - version
      - warnings
      - workspaceCurrency
    AccountPositionResponse:
      type: object
      properties:
        securityId:
          type: string
          format: uuid
        displayName:
          type: string
        isin:
          type:
          - string
          - "null"
        quantity:
          type: string
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
        price:
          type:
          - string
          - "null"
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
        priceCurrency:
          type:
          - string
          - "null"
          description: "Currency of price and value, as the statement printed them."
        value:
          type:
          - string
          - "null"
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
        valueInAccountCurrency:
          type:
          - string
          - "null"
          format: decimal
          description: Exact decimal encoded as a plain JSON string. Strings are canonical
            on requests; JSON numbers remain accepted for compatibility.
        costBasis:
          type:
          - string
          - "null"
          format: decimal
          description: "Cost basis as the statement printed it, never converted."
        costBasisEstimated:
          type: boolean
        unrealisedGain:
          type:
          - string
          - "null"
          format: decimal
          description: "valueInAccountCurrency minus costBasis. Null without a cost\
            \ basis or value, and when priceCurrency differs from the account currency:\
            \ the cost basis carries no currency, so the gain would not be certain."
        unrealisedGainPercent:
          type:
          - string
          - "null"
          format: decimal
          description: unrealisedGain in percent of costBasis; null when unrealisedGain
            is.
        valueStatus:
          type: string
          enum:
          - CURRENT
          - ESTIMATED
          - STALE
          - UNRECONCILED
          - UNKNOWN
      required:
      - costBasis
      - costBasisEstimated
      - displayName
      - isin
      - price
      - priceCurrency
      - quantity
      - securityId
      - unrealisedGain
      - unrealisedGainPercent
      - value
      - valueInAccountCurrency
      - valueStatus
    AccountPositionsResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        currency:
          type: string
        asOf:
          type:
          - string
          - "null"
          format: date
        source:
          type: string
          enum:
          - HOLDINGS_SNAPSHOT
        complete:
          type: boolean
        positions:
          type: array
          description: "All holdings of one snapshot, by valueInAccountCurrency descending\
            \ (unknown values last), then securityId. Not paged: a snapshot holds\
            \ at most 2000 holdings, the most one holdings import accepts."
          items:
            $ref: "#/components/schemas/AccountPositionResponse"
          maxItems: 2000
          minItems: 0
      required:
      - accountId
      - asOf
      - complete
      - currency
      - positions
      - source
    AccountRow:
      type: object
      properties:
        accountId:
          type: string
