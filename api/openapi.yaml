            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          $ref: "#/components/responses/ApiProblemResponse"
      x-problem-codes:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - NOT_FOUND
      - VERSION_CONFLICT
      - ACCOUNT_ARCHIVED
      - UNPROCESSABLE
      - INTERNAL
