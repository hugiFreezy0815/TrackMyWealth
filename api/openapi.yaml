openapi: 3.1.0
info:
  title: TrackMyWealth API
  description: The REST API of TrackMyWealth. Committed as api/openapi.yaml; the build
    fails when it differs from the code.
  version: v1
servers:
- url: /
  description: The server serving this document
security:
- bearerAuth: []
paths:
  /api/v1/accounts:
    get:
      tags:
      - Accounts
      summary: List the workspace's accounts with their current value
      description: "Every active account of the workspace, or every archived one with\
        \ archived=true, oldest first. Not paged: a workspace holds tens of accounts.\
        \ Amounts are signed (assets positive, liabilities negative) and come from\
        \ the same valuation as net worth."
      operationId: listAccounts
      parameters:
      - name: portfolioId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: accountType
        in: query
        required: false
        schema:
          type: string
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 8
          pattern: "[A-Za-z0-9._-]{8,64}"
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountListItemResponse"
        "400":
          description: |-
            Problem codes:
            - `VALIDATION_FAILED`: The request body or parameters are malformed or fail validation; errors lists each rejected field. Also any other 4xx without a code of its own (e.g. 405, 415).
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: |-
            Problem codes:
            - `UNAUTHENTICATED`: No valid access token, or a sign-in was refused.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: |-
            Problem codes:
            - `NOT_FOUND`: Not found, or not visible to the caller; the two are never told apart.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: |-
            Problem codes:
            - `INTERNAL`: Unexpected; quote the correlationId when reporting it. Also any other 5xx without a code of its own.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        default:
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          $ref: "#/components/responses/ApiProblemResponse"
      x-problem-codes:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - NOT_FOUND
      - INTERNAL
    post:
      tags:
      - Accounts
      summary: Create an account
      operationId: createAccount
      parameters:
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 8
          pattern: "[A-Za-z0-9._-]{8,64}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          description: Created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummaryResponse"
        "400":
          description: |-
            Problem codes:
            - `VALIDATION_FAILED`: The request body or parameters are malformed or fail validation; errors lists each rejected field. Also any other 4xx without a code of its own (e.g. 405, 415).
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: |-
            Problem codes:
            - `UNAUTHENTICATED`: No valid access token, or a sign-in was refused.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: |-
            Problem codes:
            - `NOT_FOUND`: Not found, or not visible to the caller; the two are never told apart.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: |-
            Problem codes:
            - `CONFLICT`: The request conflicts with the current state; detail says how.
            - `VERSION_CONFLICT`: The record changed since it was read: 412 with If-Match, 409 for a lost race without it.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: |-
            Problem codes:
            - `INTERNAL`: Unexpected; quote the correlationId when reporting it. Also any other 5xx without a code of its own.
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        default:
          headers:
            X-Correlation-Id:
              description: Correlation id assigned to this request.
              schema:
                type: string
          $ref: "#/components/responses/ApiProblemResponse"
      x-problem-codes:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - NOT_FOUND
      - CONFLICT
      - VERSION_CONFLICT
      - INTERNAL
