      operationId: listImportBatchRows
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page number.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Items per page; a larger value is capped to 200, and page.size\
          \ in the response says the size applied."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: sort
        in: query
        description: "Repeatable <field>[,asc|desc]; any other field is a 400 INVALID_SORT.\
          \ Default: rowNumber,asc. The order always ends with a unique tie-breaker,\
          \ so pages never overlap."
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - rowNumber
            - "rowNumber,asc"
            - "rowNumber,desc"
      - name: X-Correlation-Id
        in: header
        description: "Optional caller correlation id. Must match [A-Za-z0-9._-]{8,64};\
          \ otherwise the server generates a UUID."
        required: false
        schema:
