# #620 native check: with the backend back, one retry clears the outage banner.
appId: com.anonymous.trackmywealth
---
- scrollUntilVisible:
    element:
      text: "Back to overview"
    direction: UP
    timeout: 60000
- tapOn: "Try again"
- extendedWaitUntil:
    notVisible: "Try again"
    timeout: 60000
- assertNotVisible: "Something went wrong.*"
- scrollUntilVisible:
    element:
      text: "Newest first.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: ios-494-07-after-retry
