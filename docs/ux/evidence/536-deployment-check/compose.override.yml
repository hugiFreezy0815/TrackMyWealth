services:
  postgres:
    ports: !override
      - "127.0.0.1:5434:5432"
  backend:
    ports: !override
      - "127.0.0.1:8091:8080"
  web:
    ports: !override []
  proxy:
    image: caddy:2.8.4-alpine
    depends_on: [web, backend]
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
