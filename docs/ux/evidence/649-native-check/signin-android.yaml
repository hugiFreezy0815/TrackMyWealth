# #649 native check: sign in as the demo partner (no MFA) with the version gate off. Env: EMAIL, PASSWORD.
appId: com.anonymous.trackmywealth
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Sign in'
    timeout: 60000
- tapOn:
    text: 'Email'
    index: 1
- inputText: ${EMAIL}
- pressKey: Enter
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn:
    text: '(?i)not now|never|no thanks'
    optional: true
- extendedWaitUntil:
    visible: 'Net worth'
    timeout: 30000
