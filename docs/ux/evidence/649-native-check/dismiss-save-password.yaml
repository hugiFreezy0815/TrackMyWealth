# iOS offers to save the password after a sign-in attempt, in the system language, and the
# sheet can appear several seconds later and cover the app. Wait for it and dismiss it.
appId: com.anonymous.trackmywealth
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Später|Not Now'
          timeout: ${WAIT_MS}
          optional: true
      - tapOn:
          text: 'Später|Not Now'
          optional: true
