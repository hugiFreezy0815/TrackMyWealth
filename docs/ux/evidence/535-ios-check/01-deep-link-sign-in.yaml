# #535: the deep link was opened while signed out (see run-ios.sh): sign-in comes first.
appId: com.anonymous.trackmywealth
---
# iOS asks before another process opens the app by link.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Email"
    timeout: 60000
- takeScreenshot: ios-01-deep-link-shows-sign-in
# The label text comes first; the field is the last element with this name.
- tapOn:
    text: "Email"
    index: 1
- inputText: ${TMW_EMAIL}
# The keyboard covers the password field and the button; Return closes it.
- pressKey: Enter
- tapOn:
    text: "Password"
    index: 1
- inputText: ${TMW_PASSWORD}
- pressKey: Enter
- tapOn:
    text: "Sign in"
    index: 1
# iOS offers to save the password.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Authenticator code"
    timeout: 30000
- takeScreenshot: ios-02-mfa-step
