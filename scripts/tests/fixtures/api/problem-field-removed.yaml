openapi: 3.1.0
info:
  title: Fixture API
  version: v1
paths:
  /api/v1/accounts:
    get:
      tags:
      - Accounts
      summary: List the workspace's accounts
      operationId: listAccounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
