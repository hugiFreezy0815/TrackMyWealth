worker_processes auto;
pid nginx.pid;
error_log stderr warn;

events {}

http {
    include mime.types;
    client_body_temp_path client-body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;

    # Expo exports templates for dynamic routes. Serve them at concrete URLs
    # without redirecting or treating missing assets as HTML.
    map $uri $expo_template {
        default "";
        ~^/overview/[^/]+/?$ "/overview/[portfolioId].html";
        ~^/portfolios/[^/]+/accounts/new/?$ "/portfolios/[portfolioId]/accounts/new.html";
        ~^/accounts/[^/]+/?$ "/accounts/[accountId].html";
        ~^/accounts/[^/]+/import/?$ "/accounts/[accountId]/import.html";
        ~^/accounts/[^/]+/imports/new/?$ "/accounts/[accountId]/imports/new.html";
        ~^/accounts/[^/]+/transactions/[^/]+/?$ "/accounts/[accountId]/transactions/[transactionId].html";
    }

    map "$status:$uri" $web_cache_control {
        default "no-store";
        "~^(200|206|304):/_expo/static/(js/web/[^/]+-[0-9a-f]{32}\.js|css/[^/]+-[0-9a-f]{32}\.css)$" "public, max-age=31536000, immutable";
        # Images and fonts carry a content hash in their name (name.<md5>.ext).
        "~^(200|206|304):/assets/.+\.[0-9a-f]{32}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
    }

    # The export is static and public; compressing it leaks no secret.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    server {
        # The public reverse proxy terminates HTTPS and redirects HTTP to HTTPS.
        listen 127.0.0.1:8082;
        root html;

        error_page 404 /+not-found.html;

        include content-security-policy.conf;
        add_header Cache-Control $web_cache_control always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options DENY always;

        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri.html @expo_route;
        }

        location @expo_route {
            if ($expo_template = "") { return 404; }
            try_files $expo_template =404;
        }

        location ^~ /_expo/ {
            try_files $uri =404;
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }
    }
}
