version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # Expo SDK 58 pins these exact versions (react-native 0.88.0-rc.4, react-native-reanimated
      # 4.7.0, react-native-worklets 0.13.0 - see node_modules/expo/bundledNativeModules.json), and
      # Mobile Web CI's `npx expo install --check` fails on any other version, patches included.
      # They move together on the SDK's schedule (`npx expo install --fix` after an Expo bump), so
      # Dependabot leaves them alone (#157).
      - dependency-name: react-native
      - dependency-name: react-native-worklets
      - dependency-name: react-native-reanimated

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
