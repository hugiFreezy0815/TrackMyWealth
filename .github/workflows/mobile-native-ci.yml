name: Mobile Native CI

# Builds the iOS and Android release apps from the Expo config and launches each on a simulator
# or emulator (mobile/scripts/native-smoke.sh), so SDK and native-module upgrades are checked
# beyond Mobile Web CI's web export. Account and transaction UI changes also need native build
# evidence before approval. Screenshots and logs are uploaded
# as the "native-smoke-*" artifacts for review.
on:
  pull_request:
    paths:
      - "mobile/src/**"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "mobile/.npmrc"
      - "mobile/app.json"
      - "mobile/scripts/native-smoke.sh"
      - ".github/workflows/mobile-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # x86_64 only: the emulator's ABI, and a quarter of the native compile time.
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: mobile
          script: bash scripts/native-smoke.sh android

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-smoke-android
          path: mobile/smoke/
          if-no-files-found: ignore

  ios:
    # Expo SDK 58's ExpoModulesJSI needs Swift 6.2, i.e. Xcode 26; macos-15 ships Xcode 16.4.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform ios

      # Ad-hoc signing lets SecureStore write the refresh token to the simulator keychain
      # during sign-in and requires no Apple developer certificate.
      - name: Build release app for the simulator
        run: >
          xcodebuild -workspace ios/TrackMyWealth.xcworkspace -scheme TrackMyWealth
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build
          CODE_SIGN_IDENTITY=- build

      - name: Verify simulator app signature
        run: |
          app="ios/build/Build/Products/Release-iphonesimulator/TrackMyWealth.app"
          codesign --verify --verbose "$app"
          signature=$(codesign -dv "$app" 2>&1)
          printf '%s\n' "$signature"
          if ! grep -Fxq 'Signature=adhoc' <<<"$signature"; then
            echo "::error::Expected the iOS simulator app to have an ad-hoc signature"
            exit 1
          fi

      - name: Smoke test on simulator
        run: bash scripts/native-smoke.sh ios

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-smoke-ios
          path: mobile/smoke/
          if-no-files-found: ignore
