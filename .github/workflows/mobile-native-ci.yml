name: Mobile Native CI

# Builds the iOS and Android release apps from the Expo config and launches each on a simulator
# or emulator (mobile/scripts/native-smoke.sh), so SDK and native-module upgrades are checked
# beyond Mobile Web CI's web export. Account and transaction UI changes also need native build
# evidence before approval. Screenshots and logs are uploaded
# as the "native-smoke-*" artifacts for review.
on:
  pull_request:
    paths:
      - "mobile/src/**"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "mobile/.npmrc"
      - "mobile/app.json"
      - "mobile/scripts/native-smoke.sh"
      - "mobile/scripts/gradle-retry.sh"
      - ".github/workflows/mobile-native-ci.yml"
  # #643: on main only to fill the Gradle cache the pull requests restore (Android only, see `ios`).
  # A cache saved by a pull request is visible to that pull request alone, and at about 1.2 GB per
  # copy it would push the other workflows' caches out of the 10 GB repository limit.
  push:
    branches: [main]
    paths:
      - "mobile/package-lock.json"
      - "mobile/app.json"
      - "mobile/scripts/gradle-retry.sh"
      - ".github/workflows/mobile-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # #643: the downloaded dependencies and the Gradle distribution, keyed on what pins their
      # versions (the Expo, React Native and Gradle plugin versions come from the lockfile, config
      # plugins from app.json). Pull requests only restore; main saves (below).
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-v1-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}
          restore-keys: gradle-v1-${{ runner.os }}-

      # x86_64 only: the emulator's ABI, and a quarter of the native compile time.
      # #643: Gradle retries a failed request itself (5 tries, from a 1 s back-off), and
      # gradle-retry.sh repeats the build when it still failed on a download.
      - name: Build release APK
        working-directory: mobile/android
        run: >
          ../scripts/gradle-retry.sh assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          -Dorg.gradle.internal.repository.max.tentatives=5
          -Dorg.gradle.internal.repository.initial.backoff=1000

      # Saved after a successful build only, so it holds everything the build needs. Gradle's lock
      # and GC bookkeeping files are left out, as the cache restores into a fresh home.
      - name: Prepare Gradle cache for saving
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        run: rm -f ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/modules-2/gc.properties
      - name: Save Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: mobile
          script: bash scripts/native-smoke.sh android

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-smoke-android
          path: mobile/smoke/
          if-no-files-found: ignore

  ios:
    # A push to main runs only to fill the Gradle cache (#643): no iOS build there.
    if: github.event_name != 'push'
    # Expo SDK 58's ExpoModulesJSI needs Swift 6.2, i.e. Xcode 26; macos-15 ships Xcode 16.4.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform ios

      # Ad-hoc signing lets SecureStore write the refresh token to the simulator keychain
      # during sign-in and requires no Apple developer certificate.
      - name: Build release app for the simulator
        run: >
          xcodebuild -workspace ios/TrackMyWealth.xcworkspace -scheme TrackMyWealth
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build
          CODE_SIGN_IDENTITY=- build

      - name: Verify simulator app signature
        run: |
          app="ios/build/Build/Products/Release-iphonesimulator/TrackMyWealth.app"
          codesign --verify --verbose "$app"
          signature=$(codesign -dv "$app" 2>&1)
          printf '%s\n' "$signature"
          if ! grep -Fxq 'Signature=adhoc' <<<"$signature"; then
            echo "::error::Expected the iOS simulator app to have an ad-hoc signature"
            exit 1
          fi

      - name: Smoke test on simulator
        run: bash scripts/native-smoke.sh ios

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-smoke-ios
          path: mobile/smoke/
          if-no-files-found: ignore
