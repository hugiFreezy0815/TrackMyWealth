name: Main health

# #187: without branch protection (not available on this free private repository, which the owner
# keeps) a red run on main could go unnoticed. When Backend CI, Semgrep or secret scanning completes
# on main, this keeps one "[CI] main is red: <workflow>" issue open while it is red and closes it
# once it is green again. The logic lives in scripts/main_health.py, which has unit tests.
on:
  workflow_run:
    workflows: [Backend CI, Semgrep, Secret scanning]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  report:
    # Pull-request runs have their own checks; only runs of main itself are reported here.
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # workflow_run always checks out the default branch, never pull-request code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Run metadata is passed as environment variables, not interpolated into the script, so no
      # workflow-provided text is ever interpreted by the shell.
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/main_health.py
