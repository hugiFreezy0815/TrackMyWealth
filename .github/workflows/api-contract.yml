name: API contract

# #372: a pull request may break the committed API contract (api/openapi.yaml) only on purpose.
# `oasdiff breaking` compares main's contract with the PR's; a breaking change fails unless the PR
# has the label `api-breaking` and a `## API breaking change` section in its description
# (scripts/api_breaking.py). Whether the file matches the code is Backend CI's drift check
# (OpenApiContractTest); this one only judges what the change does to clients.
#
# It runs again when the label `api-breaking`, the description or the base branch changes, so adding
# the label and the note turns a red run green without a new commit; scripts/merge_pr.py takes the
# newest run that was not skipped. Other label changes (sprint-N) and title edits skip the job.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    paths:
      - "backend/**"
      - "api/**"
      - "scripts/api_breaking.py"
      - "scripts/tests/test_api_breaking.py"
      - "scripts/tests/fixtures/api/**"
      - ".github/workflows/api-contract.yml"

permissions:
  contents: read
  # The PR's labels and description, read when the job runs (see the last step).
  pull-requests: read

jobs:
  api-breaking:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      github.event.action != 'edited') ||
      github.event.label.name == 'api-breaking' ||
      (github.event.action == 'edited' &&
      (github.event.changes.body != null || github.event.changes.base != null))
    # On the job, not the workflow: a skipped run must not cancel one that is checking the PR.
    concurrency:
      group: api-contract-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      # Pinned with its checksum from the release's checksums.txt. Dependabot does not see a
      # download, so bump it deliberately: version and checksum together.
      OASDIFF_VERSION: "1.34.0"
      OASDIFF_SHA256: 7c88e09fd500b231af2819eb21f6fdfc7bcdfe2741d2c1937c59e7b72c8a575a
    steps:
      # Depth 2: the PR merged into its base, and that merge's parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Install oasdiff
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "OASDIFF=$RUNNER_TEMP/oasdiff/oasdiff" >> "$GITHUB_ENV"

      # The acceptance cases (a removed field, a parameter made required, an additive change)
      # against this oasdiff, so a version bump that changes its rules shows here first.
      - name: Test the check against oasdiff
        run: python3 -m unittest scripts/tests/test_api_breaking.py -v

      # The checkout is the PR merged into its base, so its first parent is the base the merge was
      # made from and the comparison is exactly what merging would change - not a newer tip of the
      # base, whose own contract changes would read as the PR undoing them. A failing git command
      # stops the step; only a base without api/openapi.yaml leaves "$base" missing (nothing to
      # compare).
      #
      # The check is the base's scripts/api_breaking.py, not the PR's: a PR cannot loosen the check
      # that judges it (a change to the check itself takes effect for the PRs after it). Only while
      # the base has no check yet does the PR's run. This workflow file is the PR's under
      # pull_request either way; a change to it is reviewed like code.
      #
      # Labels and description are read from the PR as it is now, not from the event: a re-run of
      # an old run judges the current PR, never the labels it had back then. They reach the script
      # through the environment, never the script text.
      - name: Compare the contract with the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git rev-parse --verify --quiet HEAD^2 > /dev/null || {
            echo "::error::The checkout is not the PR merged into its base."
            exit 1
          }
          base="$RUNNER_TEMP/base-openapi.yaml"
          listed=$(git ls-tree --name-only HEAD^1 -- api/openapi.yaml)
          if [ -n "$listed" ]; then
            git show "HEAD^1:api/openapi.yaml" > "$base"
          fi
          checker=scripts/api_breaking.py
          listed=$(git ls-tree --name-only HEAD^1 -- scripts/api_breaking.py)
          if [ -n "$listed" ]; then
            checker="$RUNNER_TEMP/api_breaking.py"
            git show "HEAD^1:scripts/api_breaking.py" > "$checker"
          fi
          PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          export PR_LABELS PR_BODY
          python3 "$checker" --base "$base" --revision api/openapi.yaml --oasdiff "$OASDIFF"
