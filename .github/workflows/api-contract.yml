name: API contract

# #372: a pull request may break the committed API contract (api/openapi.yaml) only on purpose.
# `oasdiff breaking` compares main's contract with the PR's; a breaking change fails unless the PR
# has the label `api-breaking` and a `## API breaking change` section in its description
# (scripts/api_breaking.py). Whether the file matches the code is Backend CI's drift check
# (OpenApiContractTest); this one only judges what the change does to clients.
#
# It runs again when the PR's labels or description change, so adding the label and the note turns
# a red run green without a new commit; scripts/merge_pr.py takes the newest run.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    paths:
      - "backend/**"
      - "api/**"
      - "scripts/api_breaking.py"
      - "scripts/tests/test_api_breaking.py"
      - "scripts/tests/fixtures/api/**"
      - ".github/workflows/api-contract.yml"

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-breaking:
    runs-on: ubuntu-24.04
    env:
      # Pinned with its checksum from the release's checksums.txt. Dependabot does not see a
      # download, so bump it deliberately: version and checksum together.
      OASDIFF_VERSION: "1.34.0"
      OASDIFF_SHA256: 7c88e09fd500b231af2819eb21f6fdfc7bcdfe2741d2c1937c59e7b72c8a575a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install oasdiff
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "OASDIFF=$RUNNER_TEMP/oasdiff/oasdiff" >> "$GITHUB_ENV"

      # The acceptance cases (a removed field, a parameter made required, an additive change)
      # against this oasdiff, so a version bump that changes its rules shows here first.
      - name: Test the check against oasdiff
        run: python3 -m unittest scripts/tests/test_api_breaking.py -v

      # The checkout is the PR merged into its base, so the comparison is exactly what merging
      # would change. Labels and description come in through the environment, never the script.
      - name: Compare the contract with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base="$RUNNER_TEMP/base-openapi.yaml"
          if git cat-file -e "origin/$BASE_REF:api/openapi.yaml" 2>/dev/null; then
            git show "origin/$BASE_REF:api/openapi.yaml" > "$base"
          fi
          python3 scripts/api_breaking.py --base "$base" --revision api/openapi.yaml \
            --oasdiff "$OASDIFF"
