name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  # #187: every pull request runs this workflow, so its checks ("test", "sql-lint") always report
  # and can be required (scripts/merge_pr.py, .github/rulesets/main.json). A check that never runs
  # would leave a docs-only PR waiting forever. The "backend-changes" job skips the work when
  # backend/ is untouched; a skipped job counts as passed.
  pull_request:

jobs:
  backend-changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A push to main is already filtered by `paths` above. A pull request is checked out as its
      # merge commit, so diffing against the base commit gives exactly the PR's changes.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "migrations=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() { ! git diff --quiet "$BASE_SHA" HEAD -- "$@"; }
          if changed backend .github/workflows/backend-ci.yml; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if changed 'backend/src/main/resources/db/migration/*.sql'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: backend-changes
    if: needs.backend-changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Testcontainers (DatabaseBootstrapInitializerTest, TrackMyWealthApplicationStartupTest)
      # needs a Docker daemon - already present on GitHub-hosted Ubuntu runners.
      # #194: the Maven Wrapper (committed executable, 100755), so CI builds with exactly the
      # Maven version every contributor gets from ./mvnw - not whatever the runner preinstalls.
      # setup-java's maven cache covers ~/.m2/repository; the wrapper's own Maven distribution
      # lives in ~/.m2/wrapper, cached separately below so it is not downloaded on every run.
      # The wrapper verifies it against distributionSha256Sum either way.
      - name: Cache Maven Wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Run tests
        run: ./mvnw -B verify

      # Verifies the deployment path a self-hosted install (laptop or NAS) actually uses
      # (`docker compose up -d --build`, see the root README's "Running on a NAS" section) still
      # builds - separate from the Maven build above, which doesn't touch the Dockerfile at all.
      - name: Build Docker image
        run: docker build -t trackmywealth-backend .

  sql-lint:
    # Only new/changed migration files are linted, never the full directory: an already-applied
    # Flyway migration must never be rewritten (it would change its checksum and break
    # `flyway.validate-on-migrate` for every environment that already ran it - see
    # docs/architecture/database-schema.md). See .sqlfluff for the project's SQL style and
    # .sqlfluffignore for V90 (vendored verbatim from the Quartz jar, not this project's style).
    needs: backend-changes
    if: github.event_name == 'pull_request' && needs.backend-changes.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Pinned: an unpinned install picked up 4.3.0 mid-review and failed a migration that 4.1.0
      # had passed (RF04). Bump deliberately, together with any fixes the new version asks for.
      - run: pip install sqlfluff==4.3.0

      - name: Lint new/changed migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed_migrations=$(git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- 'backend/src/main/resources/db/migration/*.sql')
          if [ -z "$changed_migrations" ]; then
            echo "No changed migration files in this PR."
            exit 0
          fi
          echo "Linting:"
          echo "$changed_migrations"
          echo "$changed_migrations" | xargs sqlfluff lint
