name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # #544: see pull_request below.
      - "docker-compose.yml"
      - ".env.example"
      # #372: the drift check runs in this build, so a change to the committed contract alone
      # (api/openapi.yaml edited by hand) is checked too.
      - "api/**"
      - ".github/workflows/backend-ci.yml"
  # Manual fallback for GitHub App-authored commits when PR synchronize events are absent.
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      # #544: the Compose secret-forwarding check runs in this build, so a Compose-only change is
      # checked before it merges, not only afterwards on main.
      - "docker-compose.yml"
      - ".env.example"
      # #372: the drift check runs in this build, so a change to the committed contract alone
      # (api/openapi.yaml edited by hand) is checked too.
      - "api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # #633: this job saves the Maven repository cache, since `verify` resolves every plugin the
      # build uses. The key covers .mvn as well, so a Maven version or resolver setting change
      # starts a fresh cache.
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/**

      # Testcontainers (DatabaseBootstrapInitializerTest, TrackMyWealthApplicationStartupTest)
      # needs a Docker daemon - already present on GitHub-hosted ubuntu-24.04 runners.
      # #194: the Maven Wrapper (committed executable, 100755), so CI builds with exactly the
      # Maven version every contributor gets from ./mvnw - not whatever the runner preinstalls.
      # setup-java's maven cache covers ~/.m2/repository; the wrapper's own Maven distribution
      # lives in ~/.m2/wrapper, cached separately below so it is not downloaded on every run.
      # The wrapper verifies it against distributionSha256Sum either way.
      - name: Cache Maven Wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      # #633: resolves everything up front with retries, so a download that breaks off fails
      # this step's attempt, not the test run. Nearly instant while the Maven cache is warm.
      - name: Resolve Maven dependencies
        run: ./.mvn/resolve-dependencies.sh

      # #372: a change to api/ alone (api/openapi.yaml edited by hand) runs the full verify too.
      # The drift check (OpenApiContractTest) fails on any edit that does not match the code, so a
      # contract-only shortcut would save nothing, and a test filter could silently match nothing.
      - name: Run tests
        run: ./mvnw -B verify

      # Verifies the deployment path a self-hosted install (laptop or NAS) actually uses
      # (`docker compose up -d --build`, see the root README's "Running on a NAS" section) still
      # builds - separate from the Maven build above, which doesn't touch the Dockerfile at all.
      # #633: built with BuildKit and the GitHub Actions cache shared with scripts-ci.yml, so the
      # Maven layer (wrapper distribution and dependencies) comes from the cache while mvnw,
      # pom.xml and .mvn are unchanged, instead of from Maven Central on every run.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          tags: trackmywealth-backend
          load: true
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

      # #544: verify both explicit values reach the backend service, and omitted values
      # remain empty so developers can still run postgres-only Compose commands.
      # #536: CORS_ALLOWED_ORIGINS reaches it too, and falls back to the app's own dev default.
      - name: Check Compose secret forwarding
        working-directory: .
        run: |
          MFA_ENCRYPTION_KEY=test-mfa-key IMPORT_ACCOUNT_IDENTIFIER_KEY=test-identifier-key \
            CORS_ALLOWED_ORIGINS=https://app.example.com \
            docker compose config --format json > /tmp/tmw-compose-configured.json
          env -u MFA_ENCRYPTION_KEY -u IMPORT_ACCOUNT_IDENTIFIER_KEY -u CORS_ALLOWED_ORIGINS \
            docker compose config --format json > /tmp/tmw-compose-unset.json
          python3 - <<'PY'
          import json

          with open("/tmp/tmw-compose-configured.json", encoding="utf-8") as handle:
              configured = json.load(handle)["services"]["backend"]["environment"]
          with open("/tmp/tmw-compose-unset.json", encoding="utf-8") as handle:
              unset = json.load(handle)["services"]["backend"]["environment"]
          for name, expected in {
              "MFA_ENCRYPTION_KEY": "test-mfa-key",
              "IMPORT_ACCOUNT_IDENTIFIER_KEY": "test-identifier-key",
          }.items():
              assert configured[name] == expected, name
              assert unset[name] == "", name
          assert configured["CORS_ALLOWED_ORIGINS"] == "https://app.example.com"
          assert unset["CORS_ALLOWED_ORIGINS"] == "http://localhost:*"
          PY

  history-performance:
    # Always run the 1Y acceptance fixture for backend PRs, rather than relying on an
    # opt-in local flag. Testcontainers uses the runner's local Docker daemon.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # #633: restores the `test` job's Maven cache but never saves it. This job runs `test`
      # only, so a cache it saved would lack the packaging and report plugins, and as the job
      # that finishes first it used to win the save, leaving `verify` to download those plugins
      # from Maven Central on every run.
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/**
          cache-read-only: true
      - name: Cache Maven Wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Resolve Maven dependencies
        run: ./.mvn/resolve-dependencies.sh
      - name: Verify 1Y historical valuation performance
        env:
          HISTORY_PERF: "true"
        run: ./mvnw -B -Dtest=ValueHistoryPerformanceTest test

  sql-lint:
    # Only new/changed migration files are linted, never the full directory: an already-applied
    # Flyway migration must never be rewritten (it would change its checksum and break
    # `flyway.validate-on-migrate` for every environment that already ran it - see
    # docs/architecture/database-schema.md). See .sqlfluff for the project's SQL style and
    # .sqlfluffignore for V90 (vendored verbatim from the Quartz jar, not this project's style).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # Pinned: an unpinned install picked up 4.3.0 mid-review and failed a migration that 4.1.0
      # had passed (RF04). Bump deliberately, together with any fixes the new version asks for.
      - run: pip install sqlfluff==4.3.0

      - name: Lint new/changed migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed_migrations=$(git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- 'backend/src/main/resources/db/migration/*.sql')
          if [ -z "$changed_migrations" ]; then
            echo "No changed migration files in this PR."
            exit 0
          fi
          echo "Linting:"
          echo "$changed_migrations"
          echo "$changed_migrations" | xargs sqlfluff lint
