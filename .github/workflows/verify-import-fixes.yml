name: Verify Reviewed Import Fixes
on:
  push:
    branches: [feat/us-07-18-credit-card-statement-import]
    paths:
      - ".github/workflows/verify-import-fixes.yml"
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Clean backend verification including PostgreSQL integration tests and quality gates
        working-directory: backend
        run: ./mvnw -B clean verify
      - name: Backend Docker build
        working-directory: backend
        run: docker build -t trackmywealth-backend-review .
