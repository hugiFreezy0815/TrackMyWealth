name: Temporary history contract bootstrap

# Only used on #477's feature branch. Remove this workflow after it commits the
# canonical OpenAPI document, generated mobile types and Spotless formatting.
on:
  push:
    branches: ["feat/477-value-history"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Apply canonical Java formatting
        working-directory: backend
        run: ./mvnw -B spotless:apply

      - name: Generate OpenAPI from the running application
        working-directory: backend
        run: ./mvnw -B test -Dtest=OpenApiContractTest -Dopenapi.update=true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Generate mobile API types
        working-directory: mobile
        run: |
          npm ci
          npm run api:types

      - name: Commit generated files to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend api/openapi.yaml mobile/src/api
          if ! git diff --cached --quiet; then
            git commit -m "chore(history): regenerate OpenAPI, types and Java formatting (#477)"
            git push origin HEAD:feat/477-value-history
          fi
