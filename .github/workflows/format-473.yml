name: Temporary formatter for issue 473

on:
  push:
    branches:
      - feature/473-paginate-unbounded-lists
    paths:
      - .github/workflows/format-473.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Apply repository's Java formatter
        working-directory: backend
        run: ./mvnw -B spotless:apply
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java backend/src/test/java
          if ! git diff --cached --quiet; then
            git commit -m "style(java): apply project Spotless formatting"
            git pull --rebase origin feature/473-paginate-unbounded-lists
            git push origin HEAD:feature/473-paginate-unbounded-lists
          fi
