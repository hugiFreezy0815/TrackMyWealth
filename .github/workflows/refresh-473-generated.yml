name: Temporary API contract refresh for issue 473

on:
  push:
    branches:
      - feature/473-paginate-unbounded-lists
    paths:
      - .github/workflows/refresh-473-generated.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Generate the canonical OpenAPI schema
        working-directory: backend
        run: ./mvnw -B '-Dtest=OpenApiContractTest#theCommittedContractIsTheOneTheCodeServes' -Dopenapi.update=true test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Generate canonical TypeScript API types
        working-directory: mobile
        run: |
          npm ci
          npm run api:types
      - name: Commit generated files to the issue branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi.yaml mobile/src/api/schema.d.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(api): regenerate canonical contract and mobile types"
            git pull --rebase origin feature/473-paginate-unbounded-lists
            git push origin HEAD:feature/473-paginate-unbounded-lists
          fi
