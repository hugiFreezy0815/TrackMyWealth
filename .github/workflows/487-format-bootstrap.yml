name: Temporary #487 formatting bootstrap
on:
  pull_request:
    paths:
      - mobile/src/**
      - .github/workflows/487-format-bootstrap.yml
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/487-app-shell'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mobile
      - run: npx prettier --write src/features/shell src/features/privacy src/features/auth/auth-screen.tsx src/features/auth/auth-copy.ts src/app src/i18n
        working-directory: mobile
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- mobile/src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/src
            git commit -m "style(mobile): format app shell and privacy files (#487)"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
