# Temporary branch-only, read-only formatter report for PR #549. Remove after applying results.
name: History formatter report
on:
  push:
    branches:
      - feat/477-value-history
    paths:
      - .github/workflows/history-format-report.yml
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Apply checked formatter in disposable checkout
        run: cd backend && ./mvnw -B spotless:apply
      - name: Emit formatted source files for targeted review
        run: |
          git diff --name-only -- '*.java' | while IFS= read -r path; do
            printf 'FORMAT_FILE_START:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMAT_FILE_END:%s\n' "$path"
          done
