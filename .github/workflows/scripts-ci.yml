name: Scripts CI

# #187: unit tests for the merge gate (scripts/merge_pr.py) and the main-health alert
# (scripts/main_health.py), including the check that merge_pr.py's REQUIRED_CHECKS match the
# workflows' triggers. Standard library only, so no dependencies to install.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-ci.yml"

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -v
