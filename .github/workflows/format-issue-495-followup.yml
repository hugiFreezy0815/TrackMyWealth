name: One-time S4 followup formatting
on:
  push:
    branches: [feat/issue-495-transaction-detail]
permissions:
  contents: write
jobs:
  format-followup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx prettier --write "src/features/transaction-detail/**/*.{ts,tsx}" "src/app/accounts/[accountId]/transactions/[transactionId].tsx"
        working-directory: mobile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-issue-495-followup.yml
          git add mobile
          git commit -m "style(txn): format S4 tests and web deep link"
          git push origin HEAD:feat/issue-495-transaction-detail
