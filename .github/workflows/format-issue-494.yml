name: One-time S3 formatter
on:
  push:
    branches: [feat/issue-494-account-detail]
permissions:
  contents: write
jobs:
  format-account-detail:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx prettier --write "src/features/account-detail/**/*.{ts,tsx}" "src/app/accounts/[accountId]/index.tsx" "src/api/queries/keys.ts" "src/api/queries/resources.ts" "src/i18n/en.json" "src/i18n/de.json"
        working-directory: mobile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-issue-494.yml
          git add mobile
          git commit -m "style(account): autoformat S3"
          git push origin HEAD:feat/issue-494-account-detail
