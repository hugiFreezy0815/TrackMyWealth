name: One-time account detail formatting
on:
  push:
    branches:
      - feat/issue-494-account-detail
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message == 'chore: run one-time account formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Format changed files with the locked Prettier
        working-directory: mobile
        run: |
          npm ci
          npx prettier --write "src/features/account-detail/**/*.{ts,tsx}" "src/app/accounts/[accountId]/index.tsx" "src/api/queries/keys.ts" "src/api/queries/resources.ts" "src/i18n/en.json" "src/i18n/de.json"
      - name: Commit formatter result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-issue-494.yml
          git add mobile
          git commit -m "style(account): format S3 implementation with Prettier"
          git push origin HEAD:feat/issue-494-account-detail
