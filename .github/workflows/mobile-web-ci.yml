name: Mobile Web CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-web-ci.yml"
  # #187: every pull request runs this workflow so "build-web" always reports and can be required;
  # the "mobile-changes" job skips the build when mobile/ is untouched (see backend-ci.yml).
  pull_request:

jobs:
  mobile-changes:
    runs-on: ubuntu-24.04
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          paths="mobile .github/workflows/mobile-web-ci.yml"
          # shellcheck disable=SC2086 # two pathspecs, split on purpose
          if [ "$EVENT" != "pull_request" ] || ! git diff --quiet "$BASE_SHA" HEAD -- $paths; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  build-web:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # expo-env.d.ts (gitignored, machine-generated) is normally created the first time the
      # Expo CLI runs against the project; tsc needs it to resolve the ambient *.css/*.module.css
      # module declarations `expo/types` provides. Content matches exactly what `expo start`
      # writes on first run.
      - name: Generate Expo types
        run: |
          cat > expo-env.d.ts << 'EOF'
          /// <reference types="expo/types" />

          // NOTE: This file should not be edited and should be in your git ignore
          EOF

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Format check
        run: npx prettier --check .

      - name: Test
        run: npx jest --ci

      # This is the independent web app's build step - it's the same Expo Router codebase as
      # iOS/Android (see mobile/README.md), exported as a static site. A successful export here
      # is what the deploy pipeline for the web app would run before publishing `dist/`.
      - name: Build web export
        run: npx expo export -p web
