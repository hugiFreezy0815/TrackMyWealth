name: Mobile Web CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      # The app's types are generated from these (#375): a contract change must regenerate them.
      - "api/openapi.yaml"
      - "api/problem-codes.json"
      - ".github/workflows/mobile-web-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      # The app's types are generated from these (#375): a contract change must regenerate them.
      - "api/openapi.yaml"
      - "api/problem-codes.json"
      - ".github/workflows/mobile-web-ci.yml"

jobs:
  build-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # mobile/.npmrc turns off npm's peer-dependency check while Expo SDK 58 pins a React Native
      # release candidate, so validate every SDK-managed package against Expo's own version list.
      # Offline: against the list the installed SDK ships with, not Expo's latest online list. The
      # online list names a patch the day it is published, which mobile/.npmrc's 7-day
      # min-release-age refuses to install, so every Expo release turned CI red with no commit.
      - name: Check Expo SDK versions
        env:
          EXPO_OFFLINE: "1"
        run: npx expo install --check

      # expo-env.d.ts (gitignored, machine-generated) is normally created the first time the
      # Expo CLI runs against the project; tsc needs it to resolve the ambient *.css/*.module.css
      # module declarations `expo/types` provides. Content matches exactly what `expo start`
      # writes on first run.
      - name: Generate Expo types
        run: |
          cat > expo-env.d.ts << 'EOF'
          /// <reference types="expo/types" />

          // NOTE: This file should not be edited and should be in your git ignore
          EOF

      # US-29-05 (#375): src/api/schema.d.ts and problem-codes.generated.ts are generated from
      # api/openapi.yaml and api/problem-codes.json and never edited by hand. A stale one fails
      # here, named; then the type check below shows what a contract change breaks in the app.
      - name: Check generated API types
        run: npm run api:types:check

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Format check
        run: npx prettier --check .

      - name: Test
        run: npx jest --ci

      # #536: the CSP generator guards against policy injection and hashes the export's inline code.
      - name: Unit-test the CSP generator
        run: python3 -m unittest discover -s deploy/nginx -p 'test_*.py' -v

      # This is the independent web app's build step - it's the same Expo Router codebase as
      # iOS/Android (see mobile/README.md), exported as a static site. A successful export here
      # is what the deploy pipeline for the web app would run before publishing `dist/`.
      - name: Build web export
        run: npx expo export -p web

      - name: Install nginx for the deployment smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Check deployed web headers
        run: |
          prefix=$(mktemp -d)
          cp deploy/nginx/nginx.conf "$prefix/"
          cp /etc/nginx/mime.types "$prefix/"
          ln -s "$PWD/dist" "$prefix/html"
          python3 deploy/nginx/write-csp.py dist "$prefix/content-security-policy.conf" \
            --api-origin http://localhost:8080
          nginx -p "$prefix/" -c "$prefix/nginx.conf"
          trap 'nginx -p "$prefix/" -c "$prefix/nginx.conf" -s quit' EXIT
          bash deploy/nginx/check-headers.sh http://127.0.0.1:8082 dist http://localhost:8080
          if bash deploy/nginx/check-headers.sh http://127.0.0.1:8082 dist \
            http://localhost:8080 https://missing-api.example.invalid > "$prefix/negative.log" 2>&1; then
            echo 'The smoke check accepted a policy with a missing API origin' >&2
            exit 1
          fi
          grep -F 'Unexpected connect-src on /' "$prefix/negative.log"
          # The app must load under the CSP: headless Chrome (preinstalled on the runner) reports
          # every violation. A policy without the hydration script's hash must fail the check.
          node deploy/nginx/check-csp.mjs http://127.0.0.1:8082 / /overview /settings \
            /accounts/example/transactions/example
          cp "$prefix/content-security-policy.conf" "$prefix/policy.good"
          sed -E "s/script-src 'self' [^;]*/script-src 'self'/" "$prefix/policy.good" \
            > "$prefix/content-security-policy.conf"
          nginx -p "$prefix/" -c "$prefix/nginx.conf" -s reload
          # The reload is asynchronous: wait until nginx serves the policy without the hash.
          for attempt in $(seq 50); do
            script_src=$(curl -fsS -o /dev/null -D - http://127.0.0.1:8082/ |
              sed -nE "s/^content-security-policy:.*script-src ([^;]*);.*/\1/ip" || true)
            [[ $script_src == "'self'" ]] && break
            if ((attempt == 50)); then
              echo "nginx still serves script-src $script_src after the reload" >&2
              exit 1
            fi
            sleep 0.2
          done
          if node deploy/nginx/check-csp.mjs http://127.0.0.1:8082 / > "$prefix/csp-negative.log" 2>&1; then
            echo 'The CSP check accepted a policy that blocks the hydration script' >&2
            exit 1
          fi
          # Only the blocked hydration script counts: Chrome's effective directive for an
          # inline <script> is script-src-elem, with blocked URI "inline".
          if ! grep -Fx '  CSP violation: script-src-elem inline' "$prefix/csp-negative.log"; then
            echo 'The CSP check did not report the blocked inline hydration script:' >&2
            cat "$prefix/csp-negative.log" >&2
            exit 1
          fi

      # #536: the reference image (docker-compose.yml, profile web) serves the same headers.
      - name: Check the web image
        run: |
          docker build -f deploy/nginx/Dockerfile --build-arg EXPO_PUBLIC_API_URL=http://localhost:8080 \
            -t trackmywealth-web:ci .
          if docker run --rm trackmywealth-web:ci > /tmp/no-origins.log 2>&1; then
            echo 'The web image started without WEB_API_ORIGINS' >&2
            exit 1
          fi
          grep -F 'WEB_API_ORIGINS must name' /tmp/no-origins.log
          container=$(docker run -d -p 127.0.0.1:8083:8082 \
            -e WEB_API_ORIGINS='http://localhost:8080 https://api.example.com' trackmywealth-web:ci)
          trap 'docker rm -f "$container" > /dev/null' EXIT
          for attempt in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8083/ && break
            sleep 1
          done
          export_dir=$(mktemp -d)
          docker cp "$container:/srv/web/html/." "$export_dir"
          bash deploy/nginx/check-headers.sh http://127.0.0.1:8083 "$export_dir" \
            http://localhost:8080 https://api.example.com
          node deploy/nginx/check-csp.mjs http://127.0.0.1:8083 / /overview
