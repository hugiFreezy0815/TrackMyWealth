tmw.import.snapshot.explain.DUPLICATE_SECURITY=Two positions of this statement are the same security. A snapshot holds each security once.
tmw.import.snapshot.explain.DECIDED=A reconciliation decision covers the snapshot of {0} as it is. Reopen it before this statement completes the snapshot.
tmw.import.snapshot.explain.NEW=This statement records a new snapshot of {0} with {1}.
tmw.import.snapshot.explain.COMPLETES=This statement adds {1} to the snapshot of {0} you imported before{4,choice,0#|1# from “{3}”}.
tmw.import.snapshot.explain.ALREADY_RECORDED=This statement was already imported into the snapshot of {0}{4,choice,0#|1# from “{3}”}. Discard this import.
tmw.import.snapshot.explain.CONFLICTING=This statement differs from the snapshot of {0} you imported before{4,choice,0#|1# from “{3}”} in {2,choice,1#one place|1<{2} places}. Nothing is changed: roll back the earlier import if this statement is the right one.
tmw.import.snapshot.explain.OUT_OF_RANGE=The statement’s date {0} is in the future, before the account was opened or after it was closed.
tmw.import.snapshot.explain.RECORDED=This statement recorded the snapshot of {0}.
tmw.import.snapshot.explain.COMPLETED=This statement completed the snapshot of {0}.
tmw.import.snapshot.explain.DELETED=This import was rolled back; its snapshot of {0} was removed.
tmw.import.snapshot.explain.WITHDRAWN=This import was rolled back; its snapshot of {0} is kept as history only.
tmw.import.snapshot.explain.REMOVED=This import was rolled back; what it added to the snapshot of {0} was removed.
tmw.import.snapshot.explain.balance.ALREADY_RECORDED=The closing balance of this statement is already in the snapshot of {0}; it is not recorded again. The bookings are imported regardless.
tmw.import.snapshot.explain.balance.CONFLICTING=The closing balance of this statement differs from the snapshot of {0}; it is not recorded and nothing is overwritten. The bookings are imported regardless.
