tmw.import.row.IMPORT_ROW_AMOUNT_BOTH_SIDES=Both the debit column "{0}" and the credit column "{1}" hold an amount; only one of them may.
tmw.import.row.IMPORT_ROW_AMOUNT_OUT_OF_RANGE=Column "{0}": "{1}" has more than 16 digits before or 4 digits after the decimal separator.
tmw.import.row.IMPORT_ROW_AMOUNT_UNPARSEABLE=Column "{0}": "{1}" is not an amount with this template’s decimal and thousands separators.
tmw.import.row.IMPORT_ROW_COLUMN_MISSING=The row has no cell in column "{0}".
tmw.import.row.IMPORT_ROW_CURRENCY_INVALID=Column "{0}": "{1}" is not an ISO 4217 currency code.
tmw.import.row.IMPORT_ROW_DATE_UNPARSEABLE=Column "{0}": "{1}" is not a date in the format {2}.
tmw.import.row.IMPORT_ROW_LINE_UNMATCHED=The booking line "{0}" does not match this template’s row pattern.
tmw.import.row.IMPORT_ROW_BALANCE_MISMATCH=The statement shows the balance {0} after this booking, but the balance before it plus its amount is {1}.
tmw.import.row.IMPORT_ROW_BALANCE_LINE_MISMATCH=This balance line states the balance {0}, but the bookings above it lead to {1}: a booking above it may not have been read.
tmw.import.row.IMPORT_ROW_LINE_AMBIGUOUS=The line "{0}" looks like a booking line, but this template’s {1} finds it too, so it was not imported. Narrow one of the two patterns.
tmw.import.row.IMPORT_ROW_LINE_BEFORE_SECTION=The line "{0}" looks like a booking line, but it comes before the first section this template’s section pattern finds, so it was not imported. Check that the section pattern finds every section’s title.
tmw.import.row.IMPORT_ROW_CONTINUATION_TOO_LONG=More than {1} lines below the booking line "{0}" would continue it; they are likely no part of it. Give the template a continuation end pattern.
tmw.import.row.IMPORT_ROW_MCC_INVALID=Column "{0}": "{1}" is not a four-digit merchant category code.
tmw.import.row.IMPORT_ROW_TYPE_NOT_ALLOWED=Column "{0}": "{1}" is a transaction type this template cannot import.
tmw.import.row.IMPORT_ROW_VALUE_MISSING=Column "{0}" is empty but required.
tmw.import.row.IMPORT_ROW_CURRENCY_DIFFERS_FROM_ACCOUNT=The row is in {0}, the account in {1}; it is converted at the exchange rate of its booking date.
tmw.import.row.IMPORT_ROW_EXTERNAL_ID_REPEATED=Row {1} already has the bank reference "{0}"; only that row is imported.
tmw.import.row.IMPORT_ROW_BEFORE_OPENING_BALANCE=The booking date {0} is before the account opening balance; this transaction will be stored but will not affect the balance.
tmw.import.row.IMPORT_ROW_FUTURE_DATE=The booking date {0} is in the future.
tmw.import.row.IMPORT_ROW_VALUE_DATE_ADJUSTED=The value date is written as a day February does not have (the 30/360 interest convention); it is read as {0}, the last day of February.
tmw.import.row.IMPORT_ROW_FX_RATE_UNAVAILABLE=No exchange rate from {0} to {1} is available for {2}.
tmw.import.row.IMPORT_ROW_LEDGER_REJECTED=The ledger does not accept this row on this account: {0}
tmw.import.row.IMPORT_ROW_FILTERED=The value in this row’s filter column is not one the template accepts. It is shown but will not be imported.
tmw.import.row.IMPORT_ROW_CAMT_NOT_BOOKED=This entry has the status "{0}", not booked (BOOK); it is shown but will not be imported.
tmw.import.row.IMPORT_ROW_CAMT_DETAILS_MISMATCH=The transaction details of this collective entry add up to {1}, not to its amount {0}, so it was not split and not imported.
tmw.import.row.IMPORT_ROW_CAMT_DETAILS_CURRENCY=A transaction detail of this collective entry is in {1}, the entry in {0}, so it was not split and not imported.
tmw.import.row.IMPORT_ROW_CAMT_VALUE_INVALID=Field "{0}": "{1}" is not a value an ISO 20022 statement allows here.
tmw.import.row.IMPORT_ROW_ZERO_AMOUNT=This row has a zero amount and moves no money. It is shown but will not be imported.
tmw.import.row.IMPORT_ROW_TYPE_AMBIGUOUS=The description in column "{0}" matches the patterns of more than one transaction type; narrow one of the template’s patterns.
tmw.import.row.IMPORT_ROW_ORIGINAL_AMOUNT_INCONSISTENT=The original amount in column "{0}" and the original currency in column "{1}" do not go together: both must be filled, and the original amount must be zero exactly when the amount is.
tmw.import.row.IMPORT_ROW_EXCHANGE_RATE_OUT_OF_RANGE=Column "{0}": "{1}" is not an exchange rate; it must be greater than 0, with at most 10 digits before and 10 after the decimal separator.
tmw.import.row.IMPORT_ROW_CARD_SETTLEMENT_UNMATCHED=No matching card payment was found. Check whether this is a refund.
tmw.import.row.IMPORT_ROW_SAVINGS_POCKET_CREATED=This moves money to or from the savings pocket. Importing creates a savings account for the pocket and books the other side of the move there.
tmw.import.row.IMPORT_ROW_SAVINGS_POCKET_UNAVAILABLE=This moves money to or from the savings pocket, but its savings account cannot take it (archived, in another currency or not editable by you). It is imported as a transfer for you to review.
