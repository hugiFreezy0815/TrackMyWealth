tmw.import.row.IMPORT_ROW_SAVINGS_POCKET_UNAVAILABLE=Diese Buchung bewegt Geld in das oder aus dem Sparkonto, aber dessen Konto kann sie nicht aufnehmen (archiviert oder in anderer Währung), oder dieses Konto kann kein Sparkonto haben. Sie wird als Überweisung zur Prüfung importiert; Sie können ein anderes Konto als Sparkonto verknüpfen.
