tmw.import.row.IMPORT_ROW_AMOUNT_BOTH_SIDES=Sowohl die Soll-Spalte „{0}“ als auch die Haben-Spalte „{1}“ enthalten einen Betrag; nur eine von beiden darf.
tmw.import.row.IMPORT_ROW_AMOUNT_OUT_OF_RANGE=Spalte „{0}“: „{1}“ hat mehr als 16 Stellen vor oder 4 Stellen nach dem Dezimaltrennzeichen.
tmw.import.row.IMPORT_ROW_AMOUNT_UNPARSEABLE=Spalte „{0}“: „{1}“ ist kein Betrag mit dem Dezimal- und Tausendertrennzeichen dieser Vorlage.
tmw.import.row.IMPORT_ROW_COLUMN_MISSING=Die Zeile hat keine Zelle in Spalte „{0}“.
tmw.import.row.IMPORT_ROW_CURRENCY_INVALID=Spalte „{0}“: „{1}“ ist kein ISO-4217-Währungscode.
tmw.import.row.IMPORT_ROW_DATE_UNPARSEABLE=Spalte „{0}“: „{1}“ ist kein Datum im Format {2}.
tmw.import.row.IMPORT_ROW_LINE_UNMATCHED=Die Buchungszeile „{0}“ passt nicht zum Zeilenmuster dieser Vorlage.
tmw.import.row.IMPORT_ROW_BALANCE_MISMATCH=Der Auszug zeigt nach dieser Buchung den Saldo {0}, der Saldo davor plus ihr Betrag ergibt aber {1}.
tmw.import.row.IMPORT_ROW_BALANCE_LINE_MISMATCH=Diese Saldozeile zeigt den Saldo {0}, die Buchungen darüber ergeben aber {1}: Eine Buchung darüber wurde möglicherweise nicht gelesen.
tmw.import.row.IMPORT_ROW_LINE_AMBIGUOUS=Die Zeile „{0}“ sieht wie eine Buchungszeile aus, aber das Muster {1} dieser Vorlage findet sie auch; sie wurde nicht importiert. Grenzen Sie eines der beiden Muster ein.
tmw.import.row.IMPORT_ROW_LINE_BEFORE_SECTION=Die Zeile „{0}“ sieht wie eine Buchungszeile aus, steht aber vor dem ersten Abschnitt, den das Abschnittsmuster dieser Vorlage findet; sie wurde nicht importiert. Prüfen Sie, ob das Abschnittsmuster den Titel jedes Abschnitts findet.
tmw.import.row.IMPORT_ROW_CONTINUATION_TOO_LONG=Mehr als {1} Zeilen unter der Buchungszeile „{0}“ würden sie fortsetzen; sie gehören wahrscheinlich nicht dazu. Geben Sie der Vorlage ein Muster für das Ende der Folgezeilen.
tmw.import.row.IMPORT_ROW_MCC_INVALID=Spalte „{0}“: „{1}“ ist kein vierstelliger Händlerkategoriecode.
tmw.import.row.IMPORT_ROW_TYPE_NOT_ALLOWED=Spalte „{0}“: „{1}“ ist eine Buchungsart, die diese Vorlage nicht importieren kann.
tmw.import.row.IMPORT_ROW_VALUE_MISSING=Spalte „{0}“ ist leer, wird aber benötigt.
tmw.import.row.IMPORT_ROW_CURRENCY_DIFFERS_FROM_ACCOUNT=Die Zeile ist in {0}, das Konto in {1}; sie wird zum Wechselkurs ihres Buchungsdatums umgerechnet.
tmw.import.row.IMPORT_ROW_EXTERNAL_ID_REPEATED=Zeile {1} hat bereits die Bankreferenz „{0}“; nur diese Zeile wird importiert.
tmw.import.row.IMPORT_ROW_BEFORE_OPENING_BALANCE=Das Buchungsdatum {0} liegt vor dem Eröffnungssaldo des Kontos. Die Buchung wird gespeichert, beeinflusst den Saldo aber nicht.
tmw.import.row.IMPORT_ROW_FUTURE_DATE=Das Buchungsdatum {0} liegt in der Zukunft.
tmw.import.row.IMPORT_ROW_VALUE_DATE_ADJUSTED=Das Valutadatum ist als ein Tag geschrieben, den der Februar nicht hat (Zinsmethode 30/360); es wird als {0} gelesen, der letzte Tag des Februars.
tmw.import.row.IMPORT_ROW_FX_RATE_UNAVAILABLE=Für {2} ist kein Wechselkurs von {0} nach {1} verfügbar.
tmw.import.row.IMPORT_ROW_LEDGER_REJECTED=Das Journal nimmt diese Zeile auf diesem Konto nicht an: {0}
tmw.import.row.IMPORT_ROW_FILTERED=Der Wert in der Filterspalte dieser Zeile ist keiner, den die Importvorlage zulässt. Sie wird angezeigt, aber nicht importiert.
tmw.import.row.IMPORT_ROW_CAMT_NOT_BOOKED=Dieser Eintrag hat den Status „{0}“, nicht gebucht (BOOK); er wird angezeigt, aber nicht importiert.
tmw.import.row.IMPORT_ROW_CAMT_DETAILS_MISMATCH=Die Einzelbuchungen dieser Sammelbuchung ergeben {1}, nicht ihren Betrag {0}; sie wurde daher nicht aufgeteilt und nicht importiert.
tmw.import.row.IMPORT_ROW_CAMT_DETAILS_CURRENCY=Eine Einzelbuchung dieser Sammelbuchung ist in {1}, die Sammelbuchung in {0}; sie wurde daher nicht aufgeteilt und nicht importiert.
tmw.import.row.IMPORT_ROW_CAMT_VALUE_INVALID=Feld „{0}“: „{1}“ ist kein Wert, den ein ISO-20022-Kontoauszug hier zulässt.
tmw.import.row.IMPORT_ROW_ZERO_AMOUNT=Diese Zeile hat den Betrag null und verändert keinen Kontostand. Sie wird angezeigt, aber nicht importiert.
tmw.import.row.IMPORT_ROW_TYPE_AMBIGUOUS=Die Beschreibung in Spalte „{0}“ passt zu den Mustern mehrerer Buchungstypen; grenzen Sie eines der Muster der Vorlage ein.
tmw.import.row.IMPORT_ROW_ORIGINAL_AMOUNT_INCONSISTENT=Der Originalbetrag in Spalte „{0}“ und die Originalwährung in Spalte „{1}“ passen nicht zusammen: Beide müssen gefüllt sein, und der Originalbetrag muss genau dann null sein, wenn der Betrag null ist.
tmw.import.row.IMPORT_ROW_EXCHANGE_RATE_OUT_OF_RANGE=Spalte „{0}“: „{1}“ ist kein Wechselkurs; er muss größer als 0 sein und darf höchstens 10 Stellen vor und 10 Stellen nach dem Dezimaltrennzeichen haben.
tmw.import.row.IMPORT_ROW_CARD_SETTLEMENT_UNMATCHED=Keine passende Kartenzahlung gefunden. Prüfen Sie, ob es eine Erstattung ist.
tmw.import.row.IMPORT_ROW_SAVINGS_POCKET_CREATED=Diese Buchung bewegt Geld in das oder aus dem Sparkonto. Der Import legt für das Sparkonto ein eigenes Konto an und bucht die Gegenseite dort.
tmw.import.row.IMPORT_ROW_SAVINGS_POCKET_UNAVAILABLE=Diese Buchung bewegt Geld in das oder aus dem Sparkonto, aber dessen Konto kann sie nicht aufnehmen (archiviert, in anderer Währung oder für Sie nicht bearbeitbar), oder nur wer das Konto besitzt, kann es anlegen lassen. Sie wird als Überweisung zur Prüfung importiert.
tmw.import.row.HOLDING_VALUE_UNREADABLE=Eine Anzahl, ein Kurs, ein Wert oder ein Betrag in dieser Zeile ist nicht lesbar oder außerhalb des zulässigen Bereichs.
tmw.import.row.HOLDING_CURRENCY_MISSING=Diese Zeile nennt keine Währung, und kein Abschnitt darüber tut es.
tmw.import.row.HOLDING_IDENTIFIER_INVALID=Diese Zeile nennt keine gültige ISIN und kein gültiges Kürzel.
tmw.import.row.HOLDING_DUPLICATE=Der Auszug führt diese Position ein zweites Mal auf.
tmw.import.row.HOLDING_VALUE_MISMATCH=Anzahl mal Kurs ergibt nicht den Wert, den der Auszug nennt; prüfen Sie, ob die Spalten richtig gelesen werden.
tmw.problem.validation.detail=Die Anfrage ist ungültig.
tmw.validation.currency=muss ein gültiger ISO-4217-Währungscode sein
tmw.validation.invalid=ist ungültig
tmw.validation.isin=muss eine gültige ISIN sein (12 Zeichen, ISO-6166-Prüfziffer)
tmw.validation.mcc=muss ein vierstelliger ISO-18245-Händlerkategoriecode sein
tmw.validation.notBlankText=darf nicht leer sein
tmw.validation.workspaceName=darf nach dem Entfernen von Rand-Leerzeichen höchstens 60 Zeichen lang sein und keine Steuerzeichen enthalten
tmw.import.snapshot.explain.UNREADABLE={0,choice,1#Eine Zeile|1<{0} Zeilen} dieses Auszugs {0,choice,1#ist|1<sind} nicht lesbar. Die Vorlage muss korrigiert werden, bevor der Auszug importiert werden kann.
tmw.import.snapshot.explain.UNRESOLVED={0,choice,1#Eine Position ist ein Wertpapier|1<{0} Positionen sind Wertpapiere}, {0,choice,1#das|1<die} Ihr Workspace noch nicht kennt. Legen Sie {0,choice,1#es|1<sie} an und importieren Sie dann den Auszug.
tmw.import.snapshot.explain.DUPLICATE_SECURITY=Zwei Positionen dieses Auszugs sind dasselbe Wertpapier. Ein Stand enthält jedes Wertpapier einmal.
tmw.import.snapshot.explain.DECIDED=Eine Abgleichsentscheidung gilt für den Stand vom {0}, wie er ist. Öffnen Sie sie wieder, bevor dieser Auszug den Stand ergänzt.
tmw.import.snapshot.explain.NEW=Dieser Auszug erfasst einen neuen Stand vom {0} mit {1}.
tmw.import.snapshot.explain.COMPLETES=Dieser Auszug fügt dem zuvor importierten Stand vom {0}{4,choice,0#|1# (aus „{3}“)} {1} hinzu.
tmw.import.snapshot.explain.ALREADY_RECORDED=Dieser Auszug wurde bereits in den Stand vom {0}{4,choice,0#|1# (aus „{3}“)} importiert. Verwerfen Sie diesen Import.
tmw.import.snapshot.explain.CONFLICTING=Dieser Auszug weicht an {2,choice,1#einer Stelle|1<{2} Stellen} vom zuvor importierten Stand vom {0}{4,choice,0#|1# (aus „{3}“)} ab. Es wird nichts geändert: Machen Sie den früheren Import rückgängig, wenn dieser Auszug der richtige ist.
tmw.import.snapshot.explain.OUT_OF_RANGE=Das Datum des Auszugs, {0}, liegt in der Zukunft, vor der Eröffnung oder nach der Schließung des Kontos.
tmw.import.snapshot.explain.RECORDED=Dieser Auszug hat den Stand vom {0} erfasst.
tmw.import.snapshot.explain.COMPLETED=Dieser Auszug hat den Stand vom {0} ergänzt.
tmw.import.snapshot.explain.DELETED=Dieser Import wurde rückgängig gemacht; sein Stand vom {0} wurde entfernt.
tmw.import.snapshot.explain.WITHDRAWN=Dieser Import wurde rückgängig gemacht; sein Stand vom {0} bleibt nur als Verlauf erhalten.
tmw.import.snapshot.explain.REMOVED=Dieser Import wurde rückgängig gemacht; was er zum Stand vom {0} beigetragen hat, wurde entfernt.
tmw.import.snapshot.explain.balance.ALREADY_RECORDED=Der Schlusssaldo dieses Auszugs ist bereits im Stand vom {0} enthalten; er wird nicht erneut erfasst. Die Buchungen werden trotzdem importiert.
tmw.import.snapshot.explain.balance.CONFLICTING=Der Schlusssaldo dieses Auszugs weicht vom Stand vom {0} ab; er wird nicht erfasst und nichts wird überschrieben. Die Buchungen werden trotzdem importiert.
