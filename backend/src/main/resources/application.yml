server:
  # #60: honor X-Forwarded-For/X-Forwarded-Proto (rewriting getRemoteAddr()/isSecure() -
  # RateLimitFilter's per-source bucketing included) only from a peer matching
  # internal-proxies. Empty by default - nobody is trusted, so every client's own direct
  # address is used, exactly as before #60. Set TRUSTED_PROXIES (a java.util.regex pattern
  # Tomcat's RemoteIpValve matches the *direct* peer's address against, e.g.
  # "192\.168\.1\.10" or "10\.0\.0\.\d+") once you put a reverse proxy in front of this
  # deployment - see the root README's "Running behind a reverse proxy" section. Never trust a
  # pattern wide enough to match a real client's own address, or that client could spoof
  # X-Forwarded-For to pick its own rate-limit bucket.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES:}

spring:
  application:
    name: trackmywealth-backend

  # #153: never fall back from a missing message key to the host JVM's locale. RequestLocaleResolver
  # always selects EN or DE; a missing/unsupported Accept-Language falls back to EN.
  messages:
    fallback-to-system-locale: false

  # --- Datasource -------------------------------------------------------
  # Points at the *target* application database. DatabaseBootstrapInitializer
  # (see com.trackmywealth.backend.config) runs before this datasource is
  # created and issues `CREATE DATABASE IF NOT EXISTS` against the PostgreSQL
  # maintenance database, so the very first application start against a bare
  # PostgreSQL server is sufficient - no manual `createdb` step is required.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trackmywealth}
    username: ${DB_USERNAME:trackmywealth}
    password: ${DB_PASSWORD:trackmywealth}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 5000

  # --- Flyway -------------------------------------------------------------
  # Flyway owns the schema. It runs automatically on every application
  # startup, before the JPA/Hibernate layer touches the database:
  #   - on a brand-new database, all V*__*.sql migrations run in order and
  #     the schema is created from nothing (satisfies "deploy the database
  #     automatically when the application starts if it does not exist yet").
  #   - on an existing database, only migrations with a version number
  #     higher than the highest already recorded in flyway_schema_history
  #     are applied (satisfies "future database changes are also deployed
  #     automatically on startup" - a developer only has to add a new
  #     V<n>__description.sql file under db/migration).
  # See docs/architecture/adr/0001-database-auto-migration.md.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    # V90 (Quartz's own schema) is deliberately numbered far above the domain migrations
    # (V1-V20, V21+) to keep framework-owned schema visually separate - see
    # V90__quartz_schema.sql's header. That only works if out-of-order application is allowed:
    # once V90 has run on any environment, Flyway's default (out-of-order: false) would refuse
    # every subsequent V21..V89 domain migration as "not applied in order," since they sort
    # before the highest version already applied. V21 and V90 have no dependency on each other
    # (Quartz's tables vs. the transaction ledger), so applying V21 after V90 on an
    # already-migrated database is safe.
    out-of-order: true

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for the schema. Hibernate must
      # never create or alter tables; `validate` fails startup fast if the
      # entity model and the migrated schema have drifted apart.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  quartz:
    job-store-type: jdbc
    # Jobs are defined in code (e.g. FxRateImportJobConfig); a changed schedule must replace the
    # one stored in the JDBC job store on the next start, not be ignored.
    overwrite-existing-jobs: true
    jdbc:
      initialize-schema: never # Quartz tables are created by Flyway, see V90__quartz_schema.sql
    properties:
      org:
        quartz:
          jobStore:
            isClustered: true
            # Quartz's default StdJDBCDelegate reads job data as a BLOB; V90's PostgreSQL schema
            # stores it as BYTEA, which only this delegate reads back. Latent until #223 stored the
            # first job.
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

app:
  # Application-level configuration consumed by DatabaseBootstrapInitializer
  # and by the tenancy layer. All of it is deployment configuration
  # (NFR-DEP-002) - never a compile-time variant between self-hosted and
  # hosted topologies.
  database:
    auto-create: ${DB_AUTO_CREATE:true}
    maintenance-database: ${DB_MAINTENANCE_DATABASE:postgres}
  security:
    jwt:
      issuer: trackmywealth
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
      # Public placeholder is accepted only with an explicit Spring `dev` or `test` profile.
      # JwtSecretPolicy rejects it on every real startup. Generate deployment key material with
      # e.g. `openssl rand -base64 32` and provide it through JWT_SECRET.
      secret: ${JWT_SECRET:CHANGE_ME_IN_ENVIRONMENT_CONFIG_MIN_32_BYTES}
    mfa:
      # US-02-04: AES-256 key (Base64, must decode to exactly 32 bytes) encrypting
      # app_user.mfa_totp_secret at rest (NFR-SEC-001) - deployment configuration, like jwt.secret
      # above, never checked into source. MfaEncryptionService fails fast at startup if this
      # doesn't decode to exactly 32 bytes. The placeholder below is deliberately still
      # well-formed Base64/32 bytes so an unconfigured dev/test environment starts (same
      # trade-off jwt.secret's own placeholder above makes) - but it is public, so the service
      # logs a warning when it is in use and refuses it outright when app.deployment.topology is
      # `hosted`. It is the Base64 of MfaEncryptionService.PLACEHOLDER_PHRASE - keep them in sync
      # (MfaEncryptionServiceTest fails if they drift).
      encryption-key: ${MFA_ENCRYPTION_KEY:Q0hBTkdFX01FX0lOX0VOVklST05NRU5UX0NPTkZJRzE=}
  deployment:
    topology: ${DEPLOYMENT_TOPOLOGY:self-hosted} # self-hosted | hosted (NFR-DEP-002)
  # US-09-01: the zone whose calendar date is "today" for date-filtered reads (a card balance counts
  # rows booked on or before today). The container's own zone is UTC, which is a day behind
  # Switzerland/Germany for the first hour or two after local midnight - see BusinessDateService.
  # Any java.time.ZoneId; Europe/Zurich has the same offsets as Germany's zone.
  business-zone: ${BUSINESS_ZONE:Europe/Zurich}
  fx:
    # US-04-03/#223: the fx_rate.source every currency conversion reads. ECB is what the FX import
    # below stores; set MANUAL (with the import disabled) to run only on rates entered by hand.
    default-source: ${FX_DEFAULT_SOURCE:ECB}
    # #223/NFR-CON-003: a conversion whose stored rate is older than this before the requested
    # date is marked stale - longer than any weekend plus holiday, so normally only a provider
    # outage gets there. A java.time.Period.
    stale-after: ${FX_STALE_AFTER:P5D}
    import:
      # US-06-04 (#223): load the ECB's daily euro reference rates. Off: no scheduled job is
      # registered and a missing rate is never fetched (the request sends no user data).
      enabled: ${FX_IMPORT_ENABLED:true}
      ecb-base-url: ${FX_IMPORT_ECB_BASE_URL:https://data-api.ecb.europa.eu/service/data/EXR}
      # Quartz cron (seconds first): every two hours. The ECB publishes once, around 16:00 CET on
      # TARGET business days; a run with nothing new costs one small provider call. Only the
      # default: once an administrator sets an interval (PUT /api/v1/admin/fx-import, US-06-07),
      # that interval wins over this value at every start.
      import-cron: ${FX_IMPORT_CRON:0 0 0/2 * * ?}
      import-cron-zone: ${FX_IMPORT_CRON_ZONE:Europe/Berlin}
      # How soon history is loaded after a transaction older than every stored rate is booked.
      history-check-interval: ${FX_IMPORT_HISTORY_CHECK_INTERVAL:5m}
      connect-timeout: ${FX_IMPORT_CONNECT_TIMEOUT:5s}
      # Background calls: a year of rates arrives as one response.
      read-timeout: ${FX_IMPORT_READ_TIMEOUT:60s}
      # The one call a user's request waits for: a transaction created for a date the stored rates
      # do not reach yet (its rate is fixed at insert). A budget, not per step: waiting for another
      # request's fetch and the request's own call share it, because the request holds a database
      # connection meanwhile (and storing the rates takes a second one). Keep it well below
      # spring.datasource.hikari.connection-timeout's scale of concern: many such requests at once
      # could otherwise use up the pool.
      on-demand-read-timeout: ${FX_IMPORT_ON_DEMAND_READ_TIMEOUT:20s}
      # A fetch-on-missing that found nothing is not repeated for the same date for this long.
      on-demand-retry-after: ${FX_IMPORT_ON_DEMAND_RETRY_AFTER:1h}
    # US-10-06: maximum relative difference between the received credit and the debit converted
    # at its booking-date FX rate for separately imported cross-currency transfer legs. Such a
    # match is only proposed, never auto-confirmed.
    transfer-match-tolerance: ${FX_TRANSFER_MATCH_TOLERANCE:0.02}
  categorization:
    # US-08-01 FALLBACK_MATCH: the minimum pg_trgm similarity (0..1) between a new merchant
    # description and an earlier rule- or user-categorized one before its category is copied. The
    # match must also share the merchant's brand word (CategorizationService), which is what keeps
    # 0.3 - pg_trgm's own default - from matching on a shared city name alone. Raise it to guess
    # less often.
    fuzzy-similarity-threshold: ${CATEGORIZATION_FUZZY_THRESHOLD:0.3}
  cors:
    # Origins the browser-based web build of mobile/ is allowed to call this API from (see
    # SecurityConfig). Supports Spring's AntPathMatcher-style patterns (e.g. https://*.example.com).
    # Comma-separated; localhost with any port covers `expo start --web`'s dev server out of the
    # box. Add the deployed web app's real origin here in every non-local environment.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  authorization-denial-audit:
    # #205 / FR-TEN-004/006: object-level denials are security evidence that must never be lost,
    # but must never become a connection-pool or storage DoS vector either. Exact rows are capped
    # per principal and refill window; the first denial beyond writes one summary row, and the
    # window's suppressed count is recorded once it closes. The budget lives in memory, so every
    # bound applies per application instance. Defaults: at most ~202 rows per principal per hour.
    max-writes-per-principal: ${AUTH_DENIAL_AUDIT_MAX_WRITES_PER_PRINCIPAL:200}
    refill-period: ${AUTH_DENIAL_AUDIT_REFILL_PERIOD:1h}
    max-principals: ${AUTH_DENIAL_AUDIT_MAX_PRINCIPALS:10000}
    # Each row is written synchronously, before the 404, through a small pool of its own (never
    # the main pool; its connections come on top of DB_POOL_MAX). If it cannot be written in time,
    # the request fails with a 500 instead of losing the row (a decided trade-off, see
    # database-schema.md). The request keeps its main-pool connection meanwhile, so the connection
    # timeout must be shorter than spring.datasource.hikari.connection-timeout (checked at
    # startup), and the statement timeout (whole seconds, >= 1s) bounds a hung INSERT.
    audit-pool-size: ${AUTH_DENIAL_AUDIT_POOL_SIZE:2}
    audit-connection-timeout: ${AUTH_DENIAL_AUDIT_CONNECTION_TIMEOUT:1s}
    audit-statement-timeout: ${AUTH_DENIAL_AUDIT_STATEMENT_TIMEOUT:2s}
    # Operational/security audit data, not immutable financial history. Rows older than this are
    # deleted by AuthorizationDenialAuditRetentionService, cleanup-batch-size rows per transaction.
    retention: ${AUTH_DENIAL_AUDIT_RETENTION:90d}
    cleanup-interval: ${AUTH_DENIAL_AUDIT_CLEANUP_INTERVAL:1h}
    cleanup-batch-size: ${AUTH_DENIAL_AUDIT_CLEANUP_BATCH_SIZE:5000}
  rate-limit:
    # FR-AUT-010 (#48): per-source (IP) limits on authentication-adjacent endpoints, independent
    # of app_user's own per-account lockout (US-02-02). "capacity" tokens refill every
    # "refill-period" - see RateLimitFilter. On by default (a security control shouldn't need
    # opt-in); every functional test that isn't specifically testing this disables it explicitly.
    enabled: ${RATE_LIMIT_ENABLED:true}
    # #60: total distinct (rule, source) buckets held in memory at once, across every rule
    # combined (split evenly into each rule's own cache, not one shared by all of them) - bounds
    # memory growth against a caller spread across many source addresses (e.g. a routed IPv6
    # block, each collapsed to its own /64 bucket - see RateLimitFilter).
    max-buckets: ${RATE_LIMIT_MAX_BUCKETS:50000}
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
      refill-period: ${RATE_LIMIT_LOGIN_REFILL_PERIOD:1m}
    refresh:
      capacity: ${RATE_LIMIT_REFRESH_CAPACITY:30}
      refill-period: ${RATE_LIMIT_REFRESH_REFILL_PERIOD:1m}
    setup:
      capacity: ${RATE_LIMIT_SETUP_CAPACITY:5}
      refill-period: ${RATE_LIMIT_SETUP_REFILL_PERIOD:1m}
    session-revoke:
      capacity: ${RATE_LIMIT_SESSION_REVOKE_CAPACITY:30}
      refill-period: ${RATE_LIMIT_SESSION_REVOKE_REFILL_PERIOD:1m}
    # US-02-04: a 6-digit TOTP code has only 1,000,000 possible values - both endpoints that check
    # one against a real secret need their own brute-force limit, tighter than login's (a stolen
    # password's TOTP companion is a much smaller search space).
    mfa-verify:
      capacity: ${RATE_LIMIT_MFA_VERIFY_CAPACITY:5}
      refill-period: ${RATE_LIMIT_MFA_VERIFY_REFILL_PERIOD:1m}
    mfa-confirm:
      capacity: ${RATE_LIMIT_MFA_CONFIRM_CAPACITY:5}
      refill-period: ${RATE_LIMIT_MFA_CONFIRM_REFILL_PERIOD:1m}
    # US-12-01: POST /api/v1/securities writes to reference data shared by every tenant. Generous
    # for real use (a broker import adds a handful of new instruments), tight against flooding.
    security-create:
      capacity: ${RATE_LIMIT_SECURITY_CREATE_CAPACITY:30}
      refill-period: ${RATE_LIMIT_SECURITY_CREATE_REFILL_PERIOD:1m}
    # US-12-01: GET /api/v1/securities?isin= answers whether an instrument is in the shared
    # master, which is a cross-tenant signal (see RateLimitFilter.ruleFor). Deliberately loose -
    # an import legitimately checks far more instruments than it creates - but not unbounded.
    security-lookup:
      capacity: ${RATE_LIMIT_SECURITY_LOOKUP_CAPACITY:120}
      refill-period: ${RATE_LIMIT_SECURITY_LOOKUP_REFILL_PERIOD:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      # #191: "authorized" alone means any signed-in user; the details (database, disk space and
      # path, certificates) are operational data for administrators only. Anonymous probes and
      # ordinary users get the status alone.
      show-details: when-authorized
      roles: SYSTEM_ADMINISTRATOR

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/ui

logging:
  pattern:
    # EPIC-29 (#149): every log line of a request carries its correlation id (CorrelationIdFilter),
    # the id an error response quotes - so a reported error can be found in the logs.
    correlation: "[%X{correlationId:-}] "
  level:
    org.flywaydb: INFO
