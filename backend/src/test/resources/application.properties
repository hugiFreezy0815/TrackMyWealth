# Tests may use the repository's public JWT placeholder. Real application starts do not.
spring.profiles.active=test
# #223: no test reaches the real ECB. Tests of the FX import enable it against a stubbed provider.
app.fx.import.enabled=false
# US-07-10: a random key per test context (64 hex digits are Base64 of 48 bytes), so identifiers
# can be registered and matched in tests without a key-shaped literal in the repository.
app.import.account-identifier-key=${random.value}${random.value}
